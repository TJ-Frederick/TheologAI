# REVIEW COPY: published in PR #167 and successfully run as 40005138733.
# This copy is outside .github/workflows and cannot run from this location.
# The existing PR must have assess-preview-permissions and lack deploy-preview.
# Retains validation-complete, same-repository/main/live-head checks, the preview
# environment's existing approval/ref policy, and shared preview serialization.
preview-credential-assessment:
  name: Assess preview credential (read-only; no deployment)
  needs: validation-complete
  if: >-
    github.event_name == 'pull_request' &&
    github.event.action == 'labeled' &&
    github.event.label.name == 'assess-preview-permissions' &&
    github.event.pull_request.state == 'open' &&
    github.event.pull_request.draft == false &&
    github.event.pull_request.base.ref == 'main' &&
    github.event.pull_request.head.repo.full_name == github.repository &&
    !contains(github.event.pull_request.labels.*.name, 'deploy-preview')
  runs-on: ubuntu-latest
  timeout-minutes: 3
  permissions:
    contents: read
    pull-requests: read
  environment: preview
  concurrency:
    group: theologai-shared-preview-mutation
    cancel-in-progress: false
  steps:
    - name: Reconfirm live assessment authorization
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const {data: pr} = await github.rest.pulls.get({
            owner: context.repo.owner, repo: context.repo.repo,
            pull_number: context.issue.number,
          });
          const labels = pr.labels.map(label => label.name);
          if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main'
              || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`
              || pr.head.sha !== context.payload.pull_request.head.sha
              || !labels.includes('assess-preview-permissions')
              || labels.includes('deploy-preview')) {
            core.setFailed('Live preview assessment authorization changed.');
          }
    - name: Verify exact token and read fixed resource metadata
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      with:
        script: |
          // No checkout, packages, Wrangler, SQL, uploads, or cloud writes.
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const expectedTokenId = 'dac2ed85288c21310268159147e942dc';
          const productionD1 = '9bc79346-338b-439e-a2a5-424f4418eb21';
          const receipt = {schemaVersion: 1, observedAt: new Date().toISOString(),
            runId: String(context.runId), headSha: context.payload.pull_request.head.sha,
            cloudMethods: ['GET'], checks: []};
          const uuid = value => typeof value === 'string'
            && /^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(value);
          async function get(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/${path}`, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(10000),
              headers: {Authorization: `Bearer ${token}`, Accept: 'application/json'},
            });
            const reader = response.body.getReader();
            let size = 0;
            const chunks = [];
            try {
              for (;;) {
                const {done, value} = await reader.read();
                if (done) break;
                size += value.byteLength;
                if (size > 262144) throw new Error('Response limit');
                chunks.push(Buffer.from(value));
              }
            } finally { await reader.cancel().catch(() => {}); }
            const body = JSON.parse(Buffer.concat(chunks).toString('utf8'));
            const entry = {path, httpStatus: response.status, success: body.success === true};
            receipt.checks.push(entry);
            return {body, entry};
          }
          try {
            if (account !== '0594ed1e4c9fe35ab7d9f47991e99f3e'
                || typeof token !== 'string' || !token || token.length > 4096) {
              throw new Error('Credential metadata mismatch');
            }
            const verified = await get('tokens/verify');
            const id = verified.body.result?.id;
            const status = verified.body.result?.status;
            if (/^[0-9a-f]{32}$/i.test(id ?? '')) verified.entry.tokenId = id;
            if (['active', 'disabled', 'expired'].includes(status)) verified.entry.tokenStatus = status;
            if (!verified.entry.success || id !== expectedTokenId || status !== 'active') {
              throw new Error('Token identity mismatch');
            }
            for (const worker of ['theologai-preview', 'theologai']) {
              const {body, entry} = await get(`workers/scripts/${worker}/settings`);
              if (entry.success && Array.isArray(body.result?.bindings)) {
                entry.d1Ids = body.result.bindings.filter(b => b.type === 'd1' && uuid(b.id)).map(b => b.id);
                entry.coordinatorNamespaceIds = body.result.bindings
                  .filter(b => b.type === 'durable_object_namespace'
                    && b.name === 'THEOLOGAI_CCEL_COORDINATOR'
                    && /^[0-9a-f]{32}$/i.test(b.namespace_id ?? ''))
                  .map(b => b.namespace_id);
              }
            }
            const {body, entry} = await get(`d1/database/${productionD1}`);
            entry.productionD1MetadataMatches = entry.success && body.result?.uuid === productionD1;
          } catch {
            // Never print response bodies, credentials, raw errors, or headers.
            core.setFailed('Read-only assessment incomplete; inspect sanitized receipt.');
          } finally {
            core.info(`SEC06_READONLY_RECEIPT ${JSON.stringify(receipt)}`);
          }

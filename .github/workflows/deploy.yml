name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Short reason for the manual production deployment
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  classify-deployment:
    name: Classify Production Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.production-deployment-plan.outputs.artifact_name }}
      plan_sha256: ${{ steps.production-deployment-plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Classify exact production change set
        id: classify
        env:
          PRODUCTION_RELEASE_EVENT_NAME: ${{ github.event_name }}
          PRODUCTION_RELEASE_REF: ${{ github.ref }}
          PRODUCTION_RELEASE_PUSH_BEFORE: ${{ github.event.before }}
          PRODUCTION_RELEASE_HEAD: ${{ github.sha }}
        run: |
          PRODUCTION_RELEASE_FIRST_PARENT=''
          if [ "$PRODUCTION_RELEASE_EVENT_NAME" = 'workflow_dispatch' ]; then
            PRODUCTION_RELEASE_FIRST_PARENT="$(git rev-parse HEAD^1)"
          fi
          export PRODUCTION_RELEASE_FIRST_PARENT
          release_context="$(node scripts/resolve-production-release-context.mjs)"
          node --input-type=module -e '
            const value = JSON.parse(process.argv[1]);
            const keys = ["before", "mode", "forceDeploy", "customDomainRequired", "reason"];
            if (
              typeof value !== "object" || value === null || Array.isArray(value) ||
              Object.keys(value).length !== keys.length ||
              keys.some(key => !Object.hasOwn(value, key)) ||
              typeof value.before !== "string" ||
              !["push", "manual"].includes(value.mode) ||
              typeof value.forceDeploy !== "boolean" ||
              typeof value.customDomainRequired !== "boolean" ||
              typeof value.reason !== "string"
            ) throw new Error("invalid production release context record");
          ' "$release_context"
          before="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(value.before);' "$release_context")"
          mode="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(value.mode);' "$release_context")"
          force_deploy="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(String(value.forceDeploy));' "$release_context")"
          custom_domain_required="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(String(value.customDomainRequired));' "$release_context")"
          selection_reason="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(value.reason);' "$release_context")"
          printf '%s' "$before" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "${before}^{commit}"
          git merge-base --is-ancestor "$before" HEAD
          echo "release_context_json=$release_context" >> "$GITHUB_OUTPUT"
          if [ "$mode" = 'manual' ]; then
            test "$PRODUCTION_RELEASE_EVENT_NAME" = 'workflow_dispatch'
            test "$force_deploy" = 'true'
            test "$custom_domain_required" = 'true'
            test "$selection_reason" = 'manual-main-dispatch'
            head="$(git rev-parse HEAD)"
            {
              echo 'classification_succeeded=true'
              echo 'deploy_required=true'
              echo 'decision=deploy'
              echo "reason=$selection_reason"
              echo "base=$before"
              echo "head=$head"
              echo 'changed_path_evidence_json=[]'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$mode" = 'push'
          test "$PRODUCTION_RELEASE_EVENT_NAME" = 'push'
          test "$force_deploy" = 'false'
          test "$custom_domain_required" = 'false'
          test "$selection_reason" = 'push-before'
          GITHUB_STEP_SUMMARY='' node scripts/classify-production-deployment.mjs \
            --before "$before" \
            --after "$PRODUCTION_RELEASE_HEAD" \
            --head "$(git rev-parse HEAD)"

      - name: Create canonical production deployment plan
        id: production-deployment-plan
        env:
          PRODUCTION_PLAN_ARTIFACT_NAME: production-deployment-plan-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          PRODUCTION_PLAN_RUN_ID: ${{ github.run_id }}
          PRODUCTION_PLAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCTION_PLAN_EVENT_NAME: ${{ github.event_name }}
          PRODUCTION_PLAN_REF: ${{ github.ref }}
          PRODUCTION_PLAN_HEAD: ${{ github.sha }}
          PRODUCTION_PLAN_RELEASE_CONTEXT_JSON: ${{ steps.classify.outputs.release_context_json }}
          PRODUCTION_PLAN_CLASSIFICATION_SUCCEEDED: ${{ steps.classify.outputs.classification_succeeded }}
          PRODUCTION_PLAN_DEPLOY_REQUIRED: ${{ steps.classify.outputs.deploy_required }}
          PRODUCTION_PLAN_DECISION: ${{ steps.classify.outputs.decision }}
          PRODUCTION_PLAN_CLASSIFICATION_REASON: ${{ steps.classify.outputs.reason }}
          PRODUCTION_PLAN_BASE: ${{ steps.classify.outputs.base }}
          PRODUCTION_PLAN_CLASSIFICATION_HEAD: ${{ steps.classify.outputs.head }}
          PRODUCTION_PLAN_CHANGED_PATH_EVIDENCE_JSON: ${{ steps.classify.outputs.changed_path_evidence_json }}
        run: |
          plan_directory="$RUNNER_TEMP/production-deployment-plan"
          mkdir -p "$plan_directory"
          node scripts/production-deployment-plan.mjs create > "$plan_directory/production-deployment-plan.json"
          plan_sha256="$(sha256sum "$plan_directory/production-deployment-plan.json" | awk '{print $1}')"
          printf '%s\n' "$plan_sha256" > "$plan_directory/production-deployment-plan.sha256"
          printf 'artifact_name=%s\n' "$PRODUCTION_PLAN_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          printf 'plan_sha256=%s\n' "$plan_sha256" >> "$GITHUB_OUTPUT"
          evidence_count="$(node --input-type=module -e '
            const value = JSON.parse(process.argv[1]);
            if (!Array.isArray(value)) throw new Error("invalid changed-path evidence");
            process.stdout.write(String(value.length));
          ' "$PRODUCTION_PLAN_CHANGED_PATH_EVIDENCE_JSON")"
          {
            echo '## Production deployment plan'
            echo
            echo "- Decision: \`$PRODUCTION_PLAN_DECISION\`"
            echo "- Classification succeeded: \`$PRODUCTION_PLAN_CLASSIFICATION_SUCCEEDED\`"
            echo "- Reason: \`$PRODUCTION_PLAN_CLASSIFICATION_REASON\`"
            echo "- Base: \`$PRODUCTION_PLAN_BASE\`"
            echo "- Head: \`$PRODUCTION_PLAN_CLASSIFICATION_HEAD\`"
            echo "- Gate artifact: \`$PRODUCTION_PLAN_ARTIFACT_NAME\`"
            echo "- Plan SHA-256: \`$plan_sha256\`"
            echo "- Changed-path evidence records: \`$evidence_count\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production deployment plan gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.production-deployment-plan.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/production-deployment-plan/production-deployment-plan.json
            ${{ runner.temp }}/production-deployment-plan/production-deployment-plan.sha256
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  verify-deployment-plan:
    name: Verify Production Deployment Plan
    needs: classify-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.verify.outputs.artifact_name }}
      plan_sha256: ${{ steps.verify.outputs.plan_sha256 }}
      deploy_required: ${{ steps.verify.outputs.deploy_required }}
      decision: ${{ steps.verify.outputs.decision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Download exact production deployment plan gate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.classify-deployment.outputs.artifact_name }}
          path: ${{ runner.temp }}/production-deployment-plan-verifier
          merge-multiple: false
          digest-mismatch: error

      - name: Verify production deployment plan before environment routing
        id: verify
        env:
          EXPECTED_ARTIFACT_NAME: ${{ needs.classify-deployment.outputs.artifact_name }}
          EXPECTED_SHA256: ${{ needs.classify-deployment.outputs.plan_sha256 }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_HEAD: ${{ github.sha }}
          PRODUCTION_RELEASE_EVENT_NAME: ${{ github.event_name }}
          PRODUCTION_RELEASE_REF: ${{ github.ref }}
          PRODUCTION_RELEASE_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          PRODUCTION_RELEASE_FIRST_PARENT=''
          if [ "$PRODUCTION_RELEASE_EVENT_NAME" = 'workflow_dispatch' ]; then
            PRODUCTION_RELEASE_FIRST_PARENT="$(git rev-parse HEAD^1)"
          fi
          export PRODUCTION_RELEASE_FIRST_PARENT
          EXPECTED_RELEASE_CONTEXT_JSON="$(node scripts/resolve-production-release-context.mjs)"
          export EXPECTED_RELEASE_CONTEXT_JSON
          verified="$(node scripts/production-deployment-plan.mjs verify \
            --directory "$RUNNER_TEMP/production-deployment-plan-verifier")"
          node --input-type=module -e '
            const value = JSON.parse(process.argv[1]);
            const keys = ["artifactName", "planSha256", "classificationSucceeded", "deployRequired", "decision", "reason", "base", "head", "changedPathEvidenceCount"];
            if (
              typeof value !== "object" || value === null || Array.isArray(value) ||
              Object.keys(value).length !== keys.length || keys.some(key => !Object.hasOwn(value, key)) ||
              typeof value.artifactName !== "string" || !/^[0-9a-f]{64}$/.test(value.planSha256) ||
              value.classificationSucceeded !== true || typeof value.deployRequired !== "boolean" ||
              value.decision !== (value.deployRequired ? "deploy" : "skip") ||
              typeof value.reason !== "string" || !/^[0-9a-f]{40}$/.test(value.base) ||
              !/^[0-9a-f]{40}$/.test(value.head) || !Number.isSafeInteger(value.changedPathEvidenceCount) ||
              value.changedPathEvidenceCount < 0
            ) throw new Error("invalid verified production deployment plan record");
          ' "$verified"
          artifact_name="$(node --input-type=module -e 'const value=JSON.parse(process.argv[1]);process.stdout.write(value.artifactName)' "$verified")"
          plan_sha256="$(node --input-type=module -e 'const value=JSON.parse(process.argv[1]);process.stdout.write(value.planSha256)' "$verified")"
          deploy_required="$(node --input-type=module -e 'const value=JSON.parse(process.argv[1]);process.stdout.write(String(value.deployRequired))' "$verified")"
          decision="$(node --input-type=module -e 'const value=JSON.parse(process.argv[1]);process.stdout.write(value.decision)' "$verified")"
          reason="$(node --input-type=module -e 'const value=JSON.parse(process.argv[1]);process.stdout.write(value.reason)' "$verified")"
          evidence_count="$(node --input-type=module -e 'const value=JSON.parse(process.argv[1]);process.stdout.write(String(value.changedPathEvidenceCount))' "$verified")"
          {
            printf 'artifact_name=%s\n' "$artifact_name"
            printf 'plan_sha256=%s\n' "$plan_sha256"
            printf 'deploy_required=%s\n' "$deploy_required"
            printf 'decision=%s\n' "$decision"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Verified production deployment plan'
            echo
            echo "- Decision: \`$decision\`"
            echo "- Reason: \`$reason\`"
            echo "- Gate artifact: \`$artifact_name\`"
            echo "- Plan SHA-256: \`$plan_sha256\`"
            echo "- Changed-path evidence records: \`$evidence_count\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-dual-era-preview:
    name: Verify Protected Dual-Era Preview
    needs: verify-deployment-plan
    if: ${{ github.ref == 'refs/heads/main' && needs.verify-deployment-plan.outputs.deploy_required == 'true' && needs.verify-deployment-plan.outputs.decision == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_name: ${{ steps.evidence.outputs.artifact_name }}
      run_id: ${{ steps.evidence.outputs.run_id }}
      source_commit: ${{ steps.evidence.outputs.source_commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --no-audit

      - name: Resolve fresh protected dual-era preview evidence
        id: evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const merged = pulls.filter(pr =>
              pr.merged_at && pr.base.ref === 'main' && pr.merge_commit_sha === context.sha
            );
            if (merged.length !== 1) {
              core.setFailed(`Expected one merged main PR for ${context.sha}; found ${merged.length}.`);
              return;
            }
            const pull = merged[0];
            const artifactName = `preview-release-audit-${pull.number}-${pull.head.sha}`;
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: artifactName,
              per_page: 100,
            });
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const candidates = data.artifacts.filter(artifact =>
              artifact.name === artifactName && !artifact.expired &&
              Date.parse(artifact.created_at) >= cutoff &&
              artifact.workflow_run?.head_sha === pull.head.sha
            );
            candidates.sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
            let selected;
            for (const artifact of candidates.slice(0, 10)) {
              if (!artifact.workflow_run) continue;
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: artifact.workflow_run.id,
              });
              if (run.event === 'pull_request' && run.status === 'completed' && run.conclusion === 'success'
                && run.head_sha === pull.head.sha) {
                selected = { artifact, run };
                break;
              }
            }
            if (!selected) {
              core.setFailed(`No fresh successful protected preview artifact named ${artifactName} matched the merged source.`);
              return;
            }
            const { artifact, run } = selected;
            core.setOutput('artifact_name', artifactName);
            core.setOutput('run_id', String(run.id));
            core.setOutput('source_commit', pull.head.sha);

      - name: Download exact protected preview evidence with digest validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          run-id: ${{ steps.evidence.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/protected-dual-era-preview
          merge-multiple: false
          digest-mismatch: error

      - name: Verify source-bound dual-era preview release receipt
        env:
          SOURCE_COMMIT: ${{ steps.evidence.outputs.source_commit }}
        run: |
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          preview_server_version="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.version + '-preview')")"
          npx --no-install tsx scripts/dual-era-preview-release-receipt.ts verify \
            --receipt "$RUNNER_TEMP/protected-dual-era-preview/dual-era-preview-release-receipt.json" \
            --original-language-audit "$RUNNER_TEMP/protected-dual-era-preview/original-language-v3-preview-audit.json" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-source-commit "$SOURCE_COMMIT" \
            --expected-source-tree "$source_tree" \
            --expected-server-version "$preview_server_version"

  deploy:
    name: Test, Build & Deploy
    needs: [verify-deployment-plan, verify-dual-era-preview]
    if: ${{ github.ref == 'refs/heads/main' && needs.verify-deployment-plan.outputs.deploy_required == 'true' && needs.verify-deployment-plan.outputs.decision == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://mcp.theologai.xyz/mcp
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_RUN_ID: ${{ github.run_id }}
      EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
      EXPECTED_EVENT_NAME: ${{ github.event_name }}
      EXPECTED_REF: ${{ github.ref }}
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Resolve production release comparison context
        id: production-release-context
        env:
          PRODUCTION_RELEASE_EVENT_NAME: ${{ github.event_name }}
          PRODUCTION_RELEASE_REF: ${{ github.ref }}
          PRODUCTION_RELEASE_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          PRODUCTION_RELEASE_FIRST_PARENT=''
          if [ "$PRODUCTION_RELEASE_EVENT_NAME" = 'workflow_dispatch' ]; then
            PRODUCTION_RELEASE_FIRST_PARENT="$(git rev-parse HEAD^1)"
          fi
          export PRODUCTION_RELEASE_FIRST_PARENT
          release_context="$(node scripts/resolve-production-release-context.mjs)"
          node --input-type=module -e '
            const value = JSON.parse(process.argv[1]);
            const keys = ["before", "mode", "forceDeploy", "customDomainRequired", "reason"];
            if (
              typeof value !== "object" || value === null || Array.isArray(value) ||
              Object.keys(value).length !== keys.length ||
              keys.some(key => !Object.hasOwn(value, key)) ||
              typeof value.before !== "string" ||
              !["push", "manual"].includes(value.mode) ||
              typeof value.forceDeploy !== "boolean" ||
              typeof value.customDomainRequired !== "boolean" ||
              typeof value.reason !== "string"
            ) throw new Error("invalid production release context record");
          ' "$release_context"
          before="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(value.before);' "$release_context")"
          custom_domain_required="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(String(value.customDomainRequired));' "$release_context")"
          printf '%s' "$before" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "${before}^{commit}"
          git merge-base --is-ancestor "$before" HEAD
          {
            echo "before=$before"
            echo "custom_domain_required=$custom_domain_required"
            echo "release_context_json=$release_context"
          } >> "$GITHUB_OUTPUT"

      - name: Download verified production deployment plan gate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify-deployment-plan.outputs.artifact_name }}
          path: ${{ runner.temp }}/production-deployment-plan-protected
          merge-multiple: false
          digest-mismatch: error

      - name: Revalidate production deployment plan after approval
        env:
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify-deployment-plan.outputs.artifact_name }}
          EXPECTED_SHA256: ${{ needs.verify-deployment-plan.outputs.plan_sha256 }}
          EXPECTED_RELEASE_CONTEXT_JSON: ${{ steps.production-release-context.outputs.release_context_json }}
        run: |
          verified="$(node scripts/production-deployment-plan.mjs verify \
            --directory "$RUNNER_TEMP/production-deployment-plan-protected")"
          EXPECTED_VERIFIED_ARTIFACT_NAME="$EXPECTED_ARTIFACT_NAME" \
          EXPECTED_VERIFIED_PLAN_SHA256="$EXPECTED_SHA256" \
          node --input-type=module -e '
            const value = JSON.parse(process.argv[1]);
            const keys = ["artifactName", "planSha256", "classificationSucceeded", "deployRequired", "decision", "reason", "base", "head", "changedPathEvidenceCount"];
            if (
              typeof value !== "object" || value === null || Array.isArray(value) ||
              Object.keys(value).length !== keys.length || keys.some(key => !Object.hasOwn(value, key)) ||
              value.artifactName !== process.env.EXPECTED_VERIFIED_ARTIFACT_NAME ||
              value.planSha256 !== process.env.EXPECTED_VERIFIED_PLAN_SHA256 ||
              value.classificationSucceeded !== true || value.deployRequired !== true || value.decision !== "deploy"
            ) throw new Error("protected production deployment plan revalidation failed");
          ' "$verified"

      - run: npm ci --no-audit

      - name: Download exact protected preview evidence with digest validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify-dual-era-preview.outputs.artifact_name }}
          run-id: ${{ needs.verify-dual-era-preview.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/protected-dual-era-preview
          merge-multiple: false
          digest-mismatch: error

      - name: Verify source-bound dual-era preview release receipt
        env:
          SOURCE_COMMIT: ${{ needs.verify-dual-era-preview.outputs.source_commit }}
        run: |
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          preview_server_version="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.version + '-preview')")"
          npx --no-install tsx scripts/dual-era-preview-release-receipt.ts verify \
            --receipt "$RUNNER_TEMP/protected-dual-era-preview/dual-era-preview-release-receipt.json" \
            --original-language-audit "$RUNNER_TEMP/protected-dual-era-preview/original-language-v3-preview-audit.json" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-source-commit "$SOURCE_COMMIT" \
            --expected-source-tree "$source_tree" \
            --expected-server-version "$preview_server_version"

      - name: Detect production custom-domain declaration change
        id: production-custom-domain-change
        run: |
          before="${{ steps.production-release-context.outputs.before }}"
          if ! git cat-file -e "${before}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$before"
          fi
          git show "${before}:wrangler.toml" > "$RUNNER_TEMP/wrangler-before.toml"
          npx --no-install tsx scripts/detect-production-custom-domain-change.ts \
            --before "$RUNNER_TEMP/wrangler-before.toml" \
            --after wrangler.toml \
            --github-output "$GITHUB_OUTPUT"
          if [ '${{ steps.production-release-context.outputs.custom_domain_required }}' = 'true' ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify generated Worker binding types
        run: |
          npm run types:worker:check
          npm run types:ccel-coordinator:check

      - name: Validate production and preview Worker configuration
        run: |
          npm run validate:worker-config
          npm run validate:ccel-coordinator-config
          npm run validate:ccel-coordinator-test-config

      - name: Typecheck Node.js target
        run: |
          npm run typecheck:node
          npm run typecheck:test-node
          npm run typecheck:test-scripts
          npm run typecheck:test-frozen-context-capacity

      - name: Typecheck release-critical scripts
        run: npm run typecheck:release-scripts

      - name: Typecheck Workers target
        run: |
          npm run typecheck:worker
          npm run typecheck:ccel-coordinator

      - name: Typecheck Worker runtime tests
        run: |
          npm run typecheck:worker-runtime
          npm run typecheck:ccel-coordinator-test

      - name: Verify canonical data sources
        run: npm run data:verify-sources

      - name: Verify historical section-key lineage
        env:
          PREVIOUS_MAIN_SHA: ${{ steps.production-release-context.outputs.before }}
        run: |
          if [ "$PREVIOUS_MAIN_SHA" = '0000000000000000000000000000000000000000' ]; then
            npm run data:verify-section-keys -- --genesis
          else
            printf '%s' "$PREVIOUS_MAIN_SHA" | grep -Eq '^[0-9a-f]{40}$'
            git cat-file -e "$PREVIOUS_MAIN_SHA^{commit}"
            git merge-base --is-ancestor "$PREVIOUS_MAIN_SHA" HEAD
            if git cat-file -e "$PREVIOUS_MAIN_SHA:data/historical-section-key-plan.json"; then
              git show "$PREVIOUS_MAIN_SHA:data/historical-section-key-plan.json" > "$RUNNER_TEMP/historical-section-key-plan.previous.json"
              npm run data:verify-section-keys -- --previous-plan "$RUNNER_TEMP/historical-section-key-plan.previous.json"
            else
              npm run data:verify-section-keys -- --genesis
            fi
          fi

      - name: Confirm derived database is absent
        run: test ! -e data/theologai.db

      - name: Build SQLite database from tracked sources
        run: npm run build:db -- --output "$RUNNER_TEMP/theologai.db"

      - name: Verify generated SQLite database
        run: npm run data:verify-db -- --database "$RUNNER_TEMP/theologai.db"

      - name: Export deterministic local D1 seed
        run: npm run d1:seed:export -- --database "$RUNNER_TEMP/theologai.db" --clean

      - name: Verify and reproduce deterministic local D1 seed
        run: |
          npm run d1:seed:verify
          cp scripts/d1-seed/seed-manifest.json "$RUNNER_TEMP/d1-seed-manifest.json"
          npm run d1:seed:export -- --database "$RUNNER_TEMP/theologai.db" --clean
          cmp "$RUNNER_TEMP/d1-seed-manifest.json" scripts/d1-seed/seed-manifest.json
          npm run d1:seed:verify
          npm run d1:seed:verify-readiness-seal
          npm run d1:seed:verify-import -- --database "$RUNNER_TEMP/theologai.db"

      - name: Verify historical section compatibility evidence against generated local artifacts
        run: >-
          npx --no-install tsx scripts/historical-section-compatibility-evidence.ts
          --database "$RUNNER_TEMP/theologai.db"
          --seed-directory scripts/d1-seed

      - name: Import generated seed through local D1
        run: npm run d1:seed:verify-workerd

      - name: Run unit tests with enforced coverage thresholds
        run: npm run test:coverage

      - name: Run current-architecture integration tests
        run: npm run test:integration

      - name: Exercise Worker MCP endpoint with isolated D1
        run: |
          npm run test:worker-runtime
          npm run test:ccel-coordinator-runtime

      - name: Exercise production-like Worker bundle without test-only globals
        run: |
          npm run test:worker-bundle-ubs
          npm run test:worker-production-runtime

      - name: Build Node.js target
        run: npm run build

      - name: Exercise compiled Node HTTP MCP server
        run: npm run test:e2e:compiled

      - name: Run applicable official MCP server scenarios
        run: npm run test:conformance

      - name: Audit production dependencies
        run: npm audit --omit=dev

      # Resolve the checked-out production candidate by both name and UUID.
      # This is read-only; candidate creation/preparation is a separately
      # authorized, fail-stop operation and this workflow cannot perform it.
      - name: Capture checked-out candidate production D1 mapping (read-only)
        run: |
          npx --no-install wrangler d1 list --json > "$RUNNER_TEMP/production-d1-inventory.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts candidate-d1-name \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/production-d1-inventory.json" \
            > "$RUNNER_TEMP/production-candidate-d1-name.txt"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify candidate production D1 is compatible (read-only)
        run: |
          candidate_d1_name="$(< "$RUNNER_TEMP/production-candidate-d1-name.txt")"
          npm run d1:remote:check -- --database "$candidate_d1_name" \
            --sealed-release production \
            --output "$RUNNER_TEMP/production-d1-readiness-receipt.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload sanitized production D1 readiness receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-d1-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/production-d1-readiness-receipt.json
          retention-days: 30
          if-no-files-found: error

      # Retain a read-only predecessor record before deploy. It permits a
      # manual recovery decision if a later step fails; it cannot roll back,
      # bind, seed, delete, or otherwise mutate production.
      - name: Capture production predecessor reconciliation anchor (read-only)
        id: production-predecessor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-worker-deployments-predecessor.json"
          predecessor_version="$(npx --no-install tsx scripts/production-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/production-worker-deployments-predecessor.json")"
          npx --no-install wrangler versions view "$predecessor_version" --json > "$RUNNER_TEMP/production-worker-predecessor-version-view.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts capture-predecessor \
            --deployments "$RUNNER_TEMP/production-worker-deployments-predecessor.json" \
            --predecessor-version-view "$RUNNER_TEMP/production-worker-predecessor-version-view.json" \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/production-d1-inventory.json" \
            --output "$RUNNER_TEMP/production-worker-predecessor-anchor.json"

      - name: Upload production predecessor reconciliation anchor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-predecessor-${{ github.sha }}
          path: ${{ runner.temp }}/production-worker-predecessor-anchor.json
          retention-days: 30
          if-no-files-found: error

      - name: Capture production Worker versions before deployment (read-only)
        run: npx --no-install wrangler versions list --json > "$RUNNER_TEMP/production-worker-versions-before.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs

      - name: Require live website and audited preview custom domain
        if: steps.production-custom-domain-change.outputs.required == 'true'
        run: |
          IFS=$'\t' read -r website_status website_effective_url <<< "$(curl --fail --silent --show-error --location --max-time 30 \
            --output "$RUNNER_TEMP/theologai-website.html" \
            --write-out $'%{http_code}\t%{url_effective}' \
            https://theologai.xyz/)"
          test "$website_status" = "200"
          test "$website_effective_url" = "https://theologai.xyz/"
          test -s "$RUNNER_TEMP/theologai-website.html"

          options_status="$(curl --fail --silent --show-error --max-time 30 \
            --request OPTIONS \
            --header 'Origin: https://theologai.xyz' \
            --header 'Access-Control-Request-Method: POST' \
            --dump-header "$RUNNER_TEMP/preview-mcp-options.headers" \
            --output "$RUNNER_TEMP/preview-mcp-options.body" \
            --write-out '%{http_code}' \
            https://preview-mcp.theologai.xyz/mcp)"
          test "$options_status" = "204"
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://theologai\.xyz[[:space:]]*$' \
            "$RUNNER_TEMP/preview-mcp-options.headers"
          grep -Eiq '^access-control-allow-methods:[[:space:]]*.*POST.*OPTIONS.*[[:space:]]*$' \
            "$RUNNER_TEMP/preview-mcp-options.headers"

          npm run audit:parallel-preview -- \
            --url https://preview-mcp.theologai.xyz/mcp \
            --output "$RUNNER_TEMP/pre-production-preview-mcp-audit.json"
          test -s "$RUNNER_TEMP/pre-production-preview-mcp-audit.json"

      # A production deploy must leave the independently deployed preview
      # Worker untouched. Capture its exact sole-active version and binding
      # before the first mutating step; later verification reuses this record.
      - name: Capture preview control before production deployment (read-only)
        id: preview-control-before-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler d1 list --json > "$RUNNER_TEMP/preview-control-d1-inventory-before.json"
          npx --no-install wrangler deployments list --env preview --json > "$RUNNER_TEMP/preview-control-deployments-before.json"
          preview_version="$(npx --no-install tsx scripts/preview-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/preview-control-deployments-before.json")"
          npx --no-install wrangler versions view "$preview_version" --env preview --json > "$RUNNER_TEMP/preview-control-version-before.json"
          npx --no-install tsx scripts/preview-release-reconciliation.ts capture-control \
            --deployments "$RUNNER_TEMP/preview-control-deployments-before.json" \
            --active-version-view "$RUNNER_TEMP/preview-control-version-before.json" \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/preview-control-d1-inventory-before.json" \
            --output "$RUNNER_TEMP/preview-control-before-production.json"

      - name: Deploy to Cloudflare Workers
        id: production-worker-deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          wranglerVersion: '4.114.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            printf '%s' "$ESV_API_KEY" | npx --no-install wrangler secret put ESV_API_KEY --env=
          command: deploy --env=
        env:
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}

      - name: Verify exact active production Worker version (read-only)
        id: production-worker-pre-audit-identity
        if: ${{ steps.production-worker-deploy.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMAND_OUTPUT: ${{ steps.production-worker-deploy.outputs.command-output }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          printf '%s' "$DEPLOY_COMMAND_OUTPUT" > "$RUNNER_TEMP/production-worker-deploy.command-output.txt"
          npx --no-install wrangler versions list --json > "$RUNNER_TEMP/production-worker-versions-after.json"
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-worker-deployments-after.json"
          npx --no-install tsx scripts/verify-production-worker-deployment.ts verify-deploy \
            --before-versions "$RUNNER_TEMP/production-worker-versions-before.json" \
            --after-versions "$RUNNER_TEMP/production-worker-versions-after.json" \
            --after-deployments "$RUNNER_TEMP/production-worker-deployments-after.json" \
            --command-output "$RUNNER_TEMP/production-worker-deploy.command-output.txt" \
            --output "$RUNNER_TEMP/production-worker-deployment-pre-audit-identity.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify preview control remained unchanged after production deployment (read-only)
        id: preview-control-after-production-deploy
        if: ${{ steps.production-worker-deploy.outcome == 'success' && steps.preview-control-before-production.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler d1 list --json > "$RUNNER_TEMP/preview-control-d1-inventory-after-deploy.json"
          npx --no-install wrangler deployments list --env preview --json > "$RUNNER_TEMP/preview-control-deployments-after-deploy.json"
          preview_version="$(npx --no-install tsx scripts/preview-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/preview-control-deployments-after-deploy.json")"
          npx --no-install wrangler versions view "$preview_version" --env preview --json > "$RUNNER_TEMP/preview-control-version-after-deploy.json"
          npx --no-install tsx scripts/preview-release-reconciliation.ts verify-control \
            --control "$RUNNER_TEMP/preview-control-before-production.json" \
            --deployments "$RUNNER_TEMP/preview-control-deployments-after-deploy.json" \
            --active-version-view "$RUNNER_TEMP/preview-control-version-after-deploy.json" \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/preview-control-d1-inventory-after-deploy.json" \
            --output "$RUNNER_TEMP/preview-control-after-production-deploy.json"

      # A candidate must be sole-active and attached to the exact D1 that
      # passed readiness before either production black-box audit can begin.
      - name: Require deployed candidate production D1 binding (read-only)
        id: production-worker-candidate-cutover
        if: ${{ steps.production-worker-deploy.outcome == 'success' && steps.production-worker-pre-audit-identity.outcome == 'success' && steps.preview-control-after-production-deploy.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          observed_active_version="$(npx --no-install tsx scripts/production-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/production-worker-deployments-after.json")"
          npx --no-install wrangler versions view "$observed_active_version" --json \
            > "$RUNNER_TEMP/production-worker-candidate-version-view.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts observe-post-mutation \
            --predecessor-anchor "$RUNNER_TEMP/production-worker-predecessor-anchor.json" \
            --deployments "$RUNNER_TEMP/production-worker-deployments-after.json" \
            --observed-active-version-view "$RUNNER_TEMP/production-worker-candidate-version-view.json" \
            --wrangler-config wrangler.toml \
            --output "$RUNNER_TEMP/production-worker-candidate-cutover-observation.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts reconcile-post-mutation \
            --predecessor-anchor "$RUNNER_TEMP/production-worker-predecessor-anchor.json" \
            --deployments "$RUNNER_TEMP/production-worker-deployments-after.json" \
            --observed-active-version-view "$RUNNER_TEMP/production-worker-candidate-version-view.json" \
            --wrangler-config wrangler.toml \
            --output "$RUNNER_TEMP/production-worker-candidate-cutover.json"

      - name: Upload production candidate cutover observation
        if: ${{ always() && steps.production-worker-deploy.outcome == 'success' && steps.production-predecessor.outcome == 'success' && steps.production-worker-candidate-cutover.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-candidate-cutover-observation-${{ github.sha }}
          path: ${{ runner.temp }}/production-worker-candidate-cutover-observation.json
          retention-days: 30
          if-no-files-found: error

      # This is a bounded edge-convergence check, not a retry of either
      # protected audit. It proves the exact production v6 tool contract and
      # checked-out resource identity first.
      - name: Stabilize production release registrations at edge (read-only)
        id: production-primary-source-edge-stabilization
        if: ${{ steps.production-worker-candidate-cutover.outcome == 'success' }}
        continue-on-error: true
        run: |
          npm run audit:primary-source-edge-stabilization-production -- \
            --output "$RUNNER_TEMP/production-primary-source-edge-stabilization.json"

      - name: Upload production edge-stabilization evidence
        if: ${{ always() && steps.production-worker-candidate-cutover.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-edge-stabilization-${{ github.sha }}
          path: ${{ runner.temp }}/production-primary-source-edge-stabilization.json
          retention-days: 30
          if-no-files-found: error

      - name: Require stable production release registrations before audits
        id: production-primary-source-edge-stabilization-gate
        if: ${{ always() && steps.production-worker-candidate-cutover.outcome == 'success' }}
        run: test "${{ steps.production-primary-source-edge-stabilization.outcome }}" = success

      - name: Audit original-language v3 depth contract on production
        id: production-original-language-v3-audit
        if: ${{ steps.production-primary-source-edge-stabilization-gate.outcome == 'success' }}
        run: |
          npm run audit:original-language-v3-production -- \
            --output "$RUNNER_TEMP/original-language-v3-production-audit.json"
          test -s "$RUNNER_TEMP/original-language-v3-production-audit.json"

      - name: Audit Transform-9 historical core contract on production
        id: production-historical-core-audit
        if: ${{ steps.production-primary-source-edge-stabilization-gate.outcome == 'success' && steps.production-original-language-v3-audit.outcome == 'success' }}
        run: |
          npm run audit:historical-core-production -- \
            --output "$RUNNER_TEMP/historical-core-production-audit.json"
          test -s "$RUNNER_TEMP/historical-core-production-audit.json"

      - name: Audit Transform-11 historical spine contract on production
        id: production-historical-spine-audit
        if: ${{ steps.production-primary-source-edge-stabilization-gate.outcome == 'success' && steps.production-original-language-v3-audit.outcome == 'success' && steps.production-historical-core-audit.outcome == 'success' }}
        run: |
          npm run audit:historical-spine-production -- \
            --output "$RUNNER_TEMP/historical-spine-production-audit.json"
          test -s "$RUNNER_TEMP/historical-spine-production-audit.json"

      - name: Verify production Worker remained active through audit (read-only)
        id: production-worker-audit-identity
        if: ${{ steps.production-primary-source-edge-stabilization-gate.outcome == 'success' && steps.production-original-language-v3-audit.outcome == 'success' && steps.production-historical-core-audit.outcome == 'success' && steps.production-historical-spine-audit.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-worker-deployments-post-audit.json"
          npx --no-install tsx scripts/verify-production-worker-deployment.ts verify-audit-stability \
            --pre-audit-identity "$RUNNER_TEMP/production-worker-deployment-pre-audit-identity.json" \
            --post-audit-deployments "$RUNNER_TEMP/production-worker-deployments-post-audit.json" \
            --output "$RUNNER_TEMP/production-worker-deployment-identity.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify preview control remained unchanged after production audits (read-only)
        id: preview-control-after-production-audits
        if: ${{ steps.production-worker-audit-identity.outcome == 'success' && steps.preview-control-after-production-deploy.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler d1 list --json > "$RUNNER_TEMP/preview-control-d1-inventory-after-audits.json"
          npx --no-install wrangler deployments list --env preview --json > "$RUNNER_TEMP/preview-control-deployments-after-audits.json"
          preview_version="$(npx --no-install tsx scripts/preview-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/preview-control-deployments-after-audits.json")"
          npx --no-install wrangler versions view "$preview_version" --env preview --json > "$RUNNER_TEMP/preview-control-version-after-audits.json"
          npx --no-install tsx scripts/preview-release-reconciliation.ts verify-control \
            --control "$RUNNER_TEMP/preview-control-before-production.json" \
            --deployments "$RUNNER_TEMP/preview-control-deployments-after-audits.json" \
            --active-version-view "$RUNNER_TEMP/preview-control-version-after-audits.json" \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/preview-control-d1-inventory-after-audits.json" \
            --output "$RUNNER_TEMP/preview-control-after-production-audits.json"

      - name: Capture final schema-0009 environment isolation receipt (read-only)
        id: final-environment-isolation
        if: ${{ steps.production-worker-audit-identity.outcome == 'success' && steps.preview-control-after-production-audits.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler d1 list --json > "$RUNNER_TEMP/final-environment-d1-inventory.json"
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/final-environment-production-deployments.json"
          npx --no-install wrangler deployments list --env preview --json > "$RUNNER_TEMP/final-environment-preview-deployments.json"
          production_version="$(npx --no-install tsx scripts/production-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/final-environment-production-deployments.json")"
          preview_version="$(npx --no-install tsx scripts/preview-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/final-environment-preview-deployments.json")"
          npx --no-install wrangler versions view "$production_version" --json > "$RUNNER_TEMP/final-environment-production-version.json"
          npx --no-install wrangler versions view "$preview_version" --env preview --json > "$RUNNER_TEMP/final-environment-preview-version.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts capture-environment-isolation \
            --production-deployments "$RUNNER_TEMP/final-environment-production-deployments.json" \
            --production-active-version-view "$RUNNER_TEMP/final-environment-production-version.json" \
            --preview-deployments "$RUNNER_TEMP/final-environment-preview-deployments.json" \
            --preview-active-version-view "$RUNNER_TEMP/final-environment-preview-version.json" \
            --production-audited-identity "$RUNNER_TEMP/production-worker-deployment-identity.json" \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/final-environment-d1-inventory.json" \
            --output "$RUNNER_TEMP/final-environment-isolation-receipt.json"

      # This non-strict observation must run after an attempted deploy even if
      # a secret pre-command or deploy failed. It records current
      # routing/binding state for diagnosis but cannot recover, roll back,
      # bind, or make a failed cutover appear valid. On an otherwise successful
      # release, a failed observation is terminal rather than fail-open.
      - name: Capture final production routing/binding observation (read-only)
        id: production-final-observation
        if: ${{ always() && steps.production-predecessor.outcome == 'success' && steps.production-worker-deploy.outcome != 'skipped' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-worker-deployments-post-mutation.json"
          observed_active_version="$(npx --no-install tsx scripts/production-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/production-worker-deployments-post-mutation.json")"
          npx --no-install wrangler versions view "$observed_active_version" --json > "$RUNNER_TEMP/production-worker-observed-active-version-view.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts observe-post-mutation \
            --predecessor-anchor "$RUNNER_TEMP/production-worker-predecessor-anchor.json" \
            --deployments "$RUNNER_TEMP/production-worker-deployments-post-mutation.json" \
            --observed-active-version-view "$RUNNER_TEMP/production-worker-observed-active-version-view.json" \
            --wrangler-config wrangler.toml \
            --output "$RUNNER_TEMP/production-worker-final-routing-observation.json"

      - name: Upload final production routing/binding observation
        if: ${{ always() && steps.production-predecessor.outcome == 'success' && steps.production-worker-deploy.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-final-routing-observation-${{ github.sha }}
          path: ${{ runner.temp }}/production-worker-final-routing-observation.json
          retention-days: 30
          if-no-files-found: warn

      # The diagnostic observation above remains available after every attempted
      # deploy. A successful release additionally takes a fresh, strict
      # post-observation identity record that must match the audited Worker.
      - name: Verify final production identity after audited release (read-only)
        id: production-final-post-audit-identity
        if: ${{ steps.production-worker-audit-identity.outcome == 'success' && steps.preview-control-after-production-audits.outcome == 'success' && steps.final-environment-isolation.outcome == 'success' && steps.production-final-observation.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-worker-deployments-final-post-audit.json"
          final_version="$(npx --no-install tsx scripts/production-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/production-worker-deployments-final-post-audit.json")"
          npx --no-install wrangler versions view "$final_version" --json > "$RUNNER_TEMP/production-worker-final-post-audit-version-view.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts observe-final-post-audit \
            --predecessor-anchor "$RUNNER_TEMP/production-worker-predecessor-anchor.json" \
            --deployments "$RUNNER_TEMP/production-worker-deployments-final-post-audit.json" \
            --observed-active-version-view "$RUNNER_TEMP/production-worker-final-post-audit-version-view.json" \
            --production-audited-identity "$RUNNER_TEMP/production-worker-deployment-identity.json" \
            --wrangler-config wrangler.toml \
            --output "$RUNNER_TEMP/production-worker-final-post-audit-identity.json"

      - name: Hash sanitized production audit and reconciliation evidence
        id: production-audit-evidence
        if: ${{ steps.production-worker-deploy.outcome == 'success' && steps.production-worker-candidate-cutover.outcome == 'success' && steps.production-primary-source-edge-stabilization-gate.outcome == 'success' && steps.production-original-language-v3-audit.outcome == 'success' && steps.production-historical-core-audit.outcome == 'success' && steps.production-historical-spine-audit.outcome == 'success' && steps.production-worker-audit-identity.outcome == 'success' && steps.preview-control-after-production-audits.outcome == 'success' && steps.final-environment-isolation.outcome == 'success' && steps.production-final-observation.outcome == 'success' && steps.production-final-post-audit-identity.outcome == 'success' }}
        run: |
          edge_stabilization_sha256="$(sha256sum "$RUNNER_TEMP/production-primary-source-edge-stabilization.json" | awk '{print $1}')"
          original_language_audit_sha256="$(sha256sum "$RUNNER_TEMP/original-language-v3-production-audit.json" | awk '{print $1}')"
          historical_audit_sha256="$(sha256sum "$RUNNER_TEMP/historical-core-production-audit.json" | awk '{print $1}')"
          historical_spine_audit_sha256="$(sha256sum "$RUNNER_TEMP/historical-spine-production-audit.json" | awk '{print $1}')"
          identity_sha256="$(sha256sum "$RUNNER_TEMP/production-worker-deployment-identity.json" | awk '{print $1}')"
          candidate_cutover_observation_sha256="$(sha256sum "$RUNNER_TEMP/production-worker-candidate-cutover-observation.json" | awk '{print $1}')"
          final_routing_observation_sha256="$(sha256sum "$RUNNER_TEMP/production-worker-final-routing-observation.json" | awk '{print $1}')"
          final_post_audit_identity_sha256="$(sha256sum "$RUNNER_TEMP/production-worker-final-post-audit-identity.json" | awk '{print $1}')"
          readiness_receipt_sha256="$(sha256sum "$RUNNER_TEMP/production-d1-readiness-receipt.json" | awk '{print $1}')"
          preview_control_sha256="$(sha256sum "$RUNNER_TEMP/preview-control-after-production-audits.json" | awk '{print $1}')"
          environment_isolation_sha256="$(sha256sum "$RUNNER_TEMP/final-environment-isolation-receipt.json" | awk '{print $1}')"
          printf 'edge_stabilization_sha256=%s\n' "$edge_stabilization_sha256" >> "$GITHUB_OUTPUT"
          printf 'original_language_audit_sha256=%s\n' "$original_language_audit_sha256" >> "$GITHUB_OUTPUT"
          printf 'historical_audit_sha256=%s\n' "$historical_audit_sha256" >> "$GITHUB_OUTPUT"
          printf 'historical_spine_audit_sha256=%s\n' "$historical_spine_audit_sha256" >> "$GITHUB_OUTPUT"
          printf 'Transform-11 historical-spine audit SHA-256: `%s`\n' "$historical_spine_audit_sha256" >> "$GITHUB_STEP_SUMMARY"
          printf 'identity_record_sha256=%s\n' "$identity_sha256" >> "$GITHUB_OUTPUT"
          printf 'candidate_cutover_observation_sha256=%s\n' "$candidate_cutover_observation_sha256" >> "$GITHUB_OUTPUT"
          printf 'final_routing_observation_sha256=%s\n' "$final_routing_observation_sha256" >> "$GITHUB_OUTPUT"
          printf 'final_post_audit_identity_sha256=%s\n' "$final_post_audit_identity_sha256" >> "$GITHUB_OUTPUT"
          printf 'readiness_receipt_sha256=%s\n' "$readiness_receipt_sha256" >> "$GITHUB_OUTPUT"
          printf 'preview_control_sha256=%s\n' "$preview_control_sha256" >> "$GITHUB_OUTPUT"
          printf 'environment_isolation_sha256=%s\n' "$environment_isolation_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload production reconciliation evidence
        if: ${{ steps.production-audit-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-reconciliation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-worker-candidate-cutover-observation.json
            ${{ runner.temp }}/production-worker-candidate-cutover.json
            ${{ runner.temp }}/production-worker-final-routing-observation.json
            ${{ runner.temp }}/production-worker-final-post-audit-identity.json
            ${{ runner.temp }}/preview-control-before-production.json
            ${{ runner.temp }}/preview-control-after-production-deploy.json
            ${{ runner.temp }}/preview-control-after-production-audits.json
            ${{ runner.temp }}/final-environment-isolation-receipt.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload protected production audit evidence
        if: ${{ steps.production-audit-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-primary-source-edge-stabilization.json
            ${{ runner.temp }}/original-language-v3-production-audit.json
            ${{ runner.temp }}/historical-core-production-audit.json
            ${{ runner.temp }}/historical-spine-production-audit.json
            ${{ runner.temp }}/production-worker-deployment-identity.json
            ${{ runner.temp }}/production-worker-candidate-cutover-observation.json
            ${{ runner.temp }}/production-worker-candidate-cutover.json
            ${{ runner.temp }}/production-worker-final-routing-observation.json
            ${{ runner.temp }}/production-worker-final-post-audit-identity.json
            ${{ runner.temp }}/production-d1-readiness-receipt.json
            ${{ runner.temp }}/preview-control-before-production.json
            ${{ runner.temp }}/preview-control-after-production-deploy.json
            ${{ runner.temp }}/preview-control-after-production-audits.json
            ${{ runner.temp }}/final-environment-isolation-receipt.json
          retention-days: 30
          if-no-files-found: error

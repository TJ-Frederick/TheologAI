name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://mcp.theologai.xyz/mcp
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --no-audit

      - name: Detect production custom-domain declaration change
        id: production-custom-domain-change
        run: |
          before="${{ github.event.before }}"
          if ! git cat-file -e "${before}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$before"
          fi
          git show "${before}:wrangler.toml" > "$RUNNER_TEMP/wrangler-before.toml"
          npx --no-install tsx scripts/detect-production-custom-domain-change.ts \
            --before "$RUNNER_TEMP/wrangler-before.toml" \
            --after wrangler.toml \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify generated Worker binding types
        run: |
          npm run types:worker:check
          npm run types:ccel-coordinator:check

      - name: Validate production and preview Worker configuration
        run: |
          npm run validate:worker-config
          npm run validate:ccel-coordinator-config
          npm run validate:ccel-coordinator-test-config

      - name: Typecheck Node.js target
        run: npm run typecheck:node

      - name: Typecheck release-critical scripts
        run: npm run typecheck:release-scripts

      - name: Typecheck Workers target
        run: |
          npm run typecheck:worker
          npm run typecheck:ccel-coordinator

      - name: Typecheck Worker runtime tests
        run: |
          npm run typecheck:worker-runtime
          npm run typecheck:ccel-coordinator-test
          npm run typecheck:test-fixtures

      - name: Verify canonical data sources
        run: npm run data:verify-sources

      - name: Verify historical section-key lineage
        env:
          PREVIOUS_MAIN_SHA: ${{ github.event.before }}
        run: |
          if [ "$PREVIOUS_MAIN_SHA" = '0000000000000000000000000000000000000000' ]; then
            npm run data:verify-section-keys -- --genesis
          else
            printf '%s' "$PREVIOUS_MAIN_SHA" | grep -Eq '^[0-9a-f]{40}$'
            git cat-file -e "$PREVIOUS_MAIN_SHA^{commit}"
            git merge-base --is-ancestor "$PREVIOUS_MAIN_SHA" HEAD
            if git cat-file -e "$PREVIOUS_MAIN_SHA:data/historical-section-key-plan.json"; then
              git show "$PREVIOUS_MAIN_SHA:data/historical-section-key-plan.json" > "$RUNNER_TEMP/historical-section-key-plan.previous.json"
              npm run data:verify-section-keys -- --previous-plan "$RUNNER_TEMP/historical-section-key-plan.previous.json"
            else
              npm run data:verify-section-keys -- --genesis
            fi
          fi

      - name: Confirm derived database is absent
        run: test ! -e data/theologai.db

      - name: Build SQLite database from tracked sources
        run: npm run build:db -- --output "$RUNNER_TEMP/theologai.db"

      - name: Verify generated SQLite database
        run: npm run data:verify-db -- --database "$RUNNER_TEMP/theologai.db"

      - name: Export deterministic local D1 seed
        run: npm run d1:seed:export -- --database "$RUNNER_TEMP/theologai.db" --clean

      - name: Verify and reproduce deterministic local D1 seed
        run: |
          npm run d1:seed:verify
          cp scripts/d1-seed/seed-manifest.json "$RUNNER_TEMP/d1-seed-manifest.json"
          npm run d1:seed:export -- --database "$RUNNER_TEMP/theologai.db" --clean
          cmp "$RUNNER_TEMP/d1-seed-manifest.json" scripts/d1-seed/seed-manifest.json
          npm run d1:seed:verify
          npm run d1:seed:verify-import -- --database "$RUNNER_TEMP/theologai.db"

      - name: Verify historical section compatibility evidence against generated local artifacts
        run: >-
          npx --no-install tsx scripts/historical-section-compatibility-evidence.ts
          --database "$RUNNER_TEMP/theologai.db"
          --seed-directory scripts/d1-seed

      - name: Import generated seed through local D1
        run: npm run d1:seed:verify-workerd

      - name: Run unit tests with enforced coverage thresholds
        run: npm run test:coverage

      - name: Run current-architecture integration tests
        run: npm run test:integration

      - name: Exercise Worker MCP endpoint with isolated D1
        run: |
          npm run test:worker-runtime
          npm run test:ccel-coordinator-runtime

      - name: Exercise production-like Worker bundle without test-only globals
        run: npm run test:worker-production-runtime

      - name: Build Node.js target
        run: npm run build

      - name: Exercise compiled Node HTTP MCP server
        run: npm run test:e2e:compiled

      - name: Run applicable official MCP server scenarios
        run: npm run test:conformance

      - name: Audit production dependencies
        run: npm audit --omit=dev

      # Resolve the checked-out production candidate by both name and UUID.
      # This is read-only; candidate creation/preparation is a separately
      # authorized, fail-stop operation and this workflow cannot perform it.
      - name: Capture checked-out candidate production D1 mapping (read-only)
        run: |
          npx --no-install wrangler d1 list --json > "$RUNNER_TEMP/production-d1-inventory.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts candidate-d1-name \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/production-d1-inventory.json" \
            > "$RUNNER_TEMP/production-candidate-d1-name.txt"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify candidate production D1 is compatible (read-only)
        run: |
          candidate_d1_name="$(< "$RUNNER_TEMP/production-candidate-d1-name.txt")"
          npm run d1:remote:check -- --database "$candidate_d1_name"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Retain a read-only predecessor record before deploy. It permits a
      # manual recovery decision if a later step fails; it cannot roll back,
      # bind, seed, delete, or otherwise mutate production.
      - name: Capture production predecessor reconciliation anchor (read-only)
        id: production-predecessor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-worker-deployments-predecessor.json"
          predecessor_version="$(npx --no-install tsx scripts/production-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/production-worker-deployments-predecessor.json")"
          npx --no-install wrangler versions view "$predecessor_version" --json > "$RUNNER_TEMP/production-worker-predecessor-version-view.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts capture-predecessor \
            --deployments "$RUNNER_TEMP/production-worker-deployments-predecessor.json" \
            --predecessor-version-view "$RUNNER_TEMP/production-worker-predecessor-version-view.json" \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/production-d1-inventory.json" \
            --output "$RUNNER_TEMP/production-worker-predecessor-anchor.json"

      - name: Upload production predecessor reconciliation anchor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-predecessor-${{ github.sha }}
          path: ${{ runner.temp }}/production-worker-predecessor-anchor.json
          retention-days: 30
          if-no-files-found: error

      - name: Capture production Worker versions before deployment (read-only)
        run: npx --no-install wrangler versions list --json > "$RUNNER_TEMP/production-worker-versions-before.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs

      - name: Require live website and audited preview custom domain
        if: steps.production-custom-domain-change.outputs.required == 'true'
        run: |
          IFS=$'\t' read -r website_status website_effective_url <<< "$(curl --fail --silent --show-error --location --max-time 30 \
            --output "$RUNNER_TEMP/theologai-website.html" \
            --write-out $'%{http_code}\t%{url_effective}' \
            https://theologai.xyz/)"
          test "$website_status" = "200"
          test "$website_effective_url" = "https://theologai.xyz/"
          test -s "$RUNNER_TEMP/theologai-website.html"

          options_status="$(curl --fail --silent --show-error --max-time 30 \
            --request OPTIONS \
            --header 'Origin: https://theologai.xyz' \
            --header 'Access-Control-Request-Method: POST' \
            --dump-header "$RUNNER_TEMP/preview-mcp-options.headers" \
            --output "$RUNNER_TEMP/preview-mcp-options.body" \
            --write-out '%{http_code}' \
            https://preview-mcp.theologai.xyz/mcp)"
          test "$options_status" = "204"
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://theologai\.xyz[[:space:]]*$' \
            "$RUNNER_TEMP/preview-mcp-options.headers"
          grep -Eiq '^access-control-allow-methods:[[:space:]]*.*POST.*OPTIONS.*[[:space:]]*$' \
            "$RUNNER_TEMP/preview-mcp-options.headers"

          npm run audit:parallel-preview -- \
            --url https://preview-mcp.theologai.xyz/mcp \
            --output "$RUNNER_TEMP/pre-production-preview-mcp-audit.json"
          test -s "$RUNNER_TEMP/pre-production-preview-mcp-audit.json"

      - name: Deploy to Cloudflare Workers
        id: production-worker-deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          wranglerVersion: '4.114.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            printf '%s' "$ESV_API_KEY" | npx --no-install wrangler secret put ESV_API_KEY --env=
          command: deploy --env=
        env:
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}

      - name: Verify exact active production Worker version (read-only)
        id: production-worker-pre-audit-identity
        if: ${{ steps.production-worker-deploy.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMAND_OUTPUT: ${{ steps.production-worker-deploy.outputs.command-output }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          printf '%s' "$DEPLOY_COMMAND_OUTPUT" > "$RUNNER_TEMP/production-worker-deploy.command-output.txt"
          npx --no-install wrangler versions list --json > "$RUNNER_TEMP/production-worker-versions-after.json"
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-worker-deployments-after.json"
          npx --no-install tsx scripts/verify-production-worker-deployment.ts verify-deploy \
            --before-versions "$RUNNER_TEMP/production-worker-versions-before.json" \
            --after-versions "$RUNNER_TEMP/production-worker-versions-after.json" \
            --after-deployments "$RUNNER_TEMP/production-worker-deployments-after.json" \
            --command-output "$RUNNER_TEMP/production-worker-deploy.command-output.txt" \
            --output "$RUNNER_TEMP/production-worker-deployment-pre-audit-identity.json" \
            --github-output "$GITHUB_OUTPUT"

      # A candidate must be sole-active and attached to the exact D1 that
      # passed readiness before either production black-box audit can begin.
      - name: Require deployed candidate production D1 binding (read-only)
        id: production-worker-candidate-cutover
        if: ${{ steps.production-worker-deploy.outcome == 'success' && steps.production-worker-pre-audit-identity.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          observed_active_version="$(npx --no-install tsx scripts/production-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/production-worker-deployments-after.json")"
          npx --no-install wrangler versions view "$observed_active_version" --json \
            > "$RUNNER_TEMP/production-worker-candidate-version-view.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts observe-post-mutation \
            --predecessor-anchor "$RUNNER_TEMP/production-worker-predecessor-anchor.json" \
            --deployments "$RUNNER_TEMP/production-worker-deployments-after.json" \
            --observed-active-version-view "$RUNNER_TEMP/production-worker-candidate-version-view.json" \
            --wrangler-config wrangler.toml \
            --output "$RUNNER_TEMP/production-worker-candidate-cutover-observation.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts reconcile-post-mutation \
            --predecessor-anchor "$RUNNER_TEMP/production-worker-predecessor-anchor.json" \
            --deployments "$RUNNER_TEMP/production-worker-deployments-after.json" \
            --observed-active-version-view "$RUNNER_TEMP/production-worker-candidate-version-view.json" \
            --wrangler-config wrangler.toml \
            --output "$RUNNER_TEMP/production-worker-candidate-cutover.json"

      - name: Upload production candidate cutover observation
        if: ${{ always() && steps.production-worker-deploy.outcome == 'success' && steps.production-predecessor.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-candidate-cutover-observation-${{ github.sha }}
          path: ${{ runner.temp }}/production-worker-candidate-cutover-observation.json
          retention-days: 30
          if-no-files-found: error

      # This is a bounded edge-convergence check, not a retry of either
      # protected audit. It proves the exact production v6 tool contract and
      # checked-out resource identity first.
      - name: Stabilize production release registrations at edge (read-only)
        id: production-primary-source-edge-stabilization
        if: ${{ steps.production-worker-candidate-cutover.outcome == 'success' }}
        continue-on-error: true
        run: |
          npm run audit:primary-source-edge-stabilization-production -- \
            --output "$RUNNER_TEMP/production-primary-source-edge-stabilization.json"

      - name: Upload production edge-stabilization evidence
        if: ${{ always() && steps.production-worker-candidate-cutover.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-edge-stabilization-${{ github.sha }}
          path: ${{ runner.temp }}/production-primary-source-edge-stabilization.json
          retention-days: 30
          if-no-files-found: error

      - name: Require stable production release registrations before audits
        id: production-primary-source-edge-stabilization-gate
        if: ${{ always() && steps.production-worker-candidate-cutover.outcome == 'success' }}
        run: test "${{ steps.production-primary-source-edge-stabilization.outcome }}" = success

      - name: Audit original-language v2 contract on production
        id: production-original-language-v2-audit
        if: ${{ steps.production-primary-source-edge-stabilization-gate.outcome == 'success' }}
        run: |
          npm run audit:original-language-v2-production -- \
            --output "$RUNNER_TEMP/original-language-v2-production-audit.json"
          test -s "$RUNNER_TEMP/original-language-v2-production-audit.json"

      - name: Audit Transform-9 historical core contract on production
        id: production-historical-core-audit
        if: ${{ steps.production-primary-source-edge-stabilization-gate.outcome == 'success' && steps.production-original-language-v2-audit.outcome == 'success' }}
        run: |
          npm run audit:historical-core-production -- \
            --output "$RUNNER_TEMP/historical-core-production-audit.json"
          test -s "$RUNNER_TEMP/historical-core-production-audit.json"

      - name: Audit Transform-11 historical spine contract on production
        id: production-historical-spine-audit
        if: ${{ steps.production-primary-source-edge-stabilization-gate.outcome == 'success' && steps.production-original-language-v2-audit.outcome == 'success' && steps.production-historical-core-audit.outcome == 'success' }}
        run: |
          npm run audit:historical-spine-production -- \
            --output "$RUNNER_TEMP/historical-spine-production-audit.json"
          test -s "$RUNNER_TEMP/historical-spine-production-audit.json"

      - name: Verify production Worker remained active through audit (read-only)
        id: production-worker-audit-identity
        if: ${{ steps.production-primary-source-edge-stabilization-gate.outcome == 'success' && steps.production-original-language-v2-audit.outcome == 'success' && steps.production-historical-core-audit.outcome == 'success' && steps.production-historical-spine-audit.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-worker-deployments-post-audit.json"
          npx --no-install tsx scripts/verify-production-worker-deployment.ts verify-audit-stability \
            --pre-audit-identity "$RUNNER_TEMP/production-worker-deployment-pre-audit-identity.json" \
            --post-audit-deployments "$RUNNER_TEMP/production-worker-deployments-post-audit.json" \
            --output "$RUNNER_TEMP/production-worker-deployment-identity.json" \
            --github-output "$GITHUB_OUTPUT"

      # This non-strict observation must run after an attempted deploy even if
      # a secret pre-command or deploy failed. It records current
      # routing/binding state for diagnosis but cannot recover, roll back,
      # bind, or make a failed cutover appear valid. On an otherwise successful
      # release, a failed observation is terminal rather than fail-open.
      - name: Capture final production routing/binding observation (read-only)
        id: production-final-observation
        if: ${{ always() && steps.production-predecessor.outcome == 'success' && steps.production-worker-deploy.outcome != 'skipped' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-worker-deployments-post-mutation.json"
          observed_active_version="$(npx --no-install tsx scripts/production-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/production-worker-deployments-post-mutation.json")"
          npx --no-install wrangler versions view "$observed_active_version" --json > "$RUNNER_TEMP/production-worker-observed-active-version-view.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts observe-post-mutation \
            --predecessor-anchor "$RUNNER_TEMP/production-worker-predecessor-anchor.json" \
            --deployments "$RUNNER_TEMP/production-worker-deployments-post-mutation.json" \
            --observed-active-version-view "$RUNNER_TEMP/production-worker-observed-active-version-view.json" \
            --wrangler-config wrangler.toml \
            --output "$RUNNER_TEMP/production-worker-final-routing-observation.json"

      - name: Upload final production routing/binding observation
        if: ${{ always() && steps.production-predecessor.outcome == 'success' && steps.production-worker-deploy.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-final-routing-observation-${{ github.sha }}
          path: ${{ runner.temp }}/production-worker-final-routing-observation.json
          retention-days: 30
          if-no-files-found: warn

      - name: Hash sanitized production audit and reconciliation evidence
        id: production-audit-evidence
        if: ${{ steps.production-worker-deploy.outcome == 'success' && steps.production-worker-candidate-cutover.outcome == 'success' && steps.production-primary-source-edge-stabilization-gate.outcome == 'success' && steps.production-original-language-v2-audit.outcome == 'success' && steps.production-historical-core-audit.outcome == 'success' && steps.production-historical-spine-audit.outcome == 'success' && steps.production-worker-audit-identity.outcome == 'success' && steps.production-final-observation.outcome == 'success' }}
        run: |
          edge_stabilization_sha256="$(sha256sum "$RUNNER_TEMP/production-primary-source-edge-stabilization.json" | awk '{print $1}')"
          original_language_audit_sha256="$(sha256sum "$RUNNER_TEMP/original-language-v2-production-audit.json" | awk '{print $1}')"
          historical_audit_sha256="$(sha256sum "$RUNNER_TEMP/historical-core-production-audit.json" | awk '{print $1}')"
          historical_spine_audit_sha256="$(sha256sum "$RUNNER_TEMP/historical-spine-production-audit.json" | awk '{print $1}')"
          identity_sha256="$(sha256sum "$RUNNER_TEMP/production-worker-deployment-identity.json" | awk '{print $1}')"
          candidate_cutover_observation_sha256="$(sha256sum "$RUNNER_TEMP/production-worker-candidate-cutover-observation.json" | awk '{print $1}')"
          final_routing_observation_sha256="$(sha256sum "$RUNNER_TEMP/production-worker-final-routing-observation.json" | awk '{print $1}')"
          printf 'edge_stabilization_sha256=%s\n' "$edge_stabilization_sha256" >> "$GITHUB_OUTPUT"
          printf 'original_language_audit_sha256=%s\n' "$original_language_audit_sha256" >> "$GITHUB_OUTPUT"
          printf 'historical_audit_sha256=%s\n' "$historical_audit_sha256" >> "$GITHUB_OUTPUT"
          printf 'historical_spine_audit_sha256=%s\n' "$historical_spine_audit_sha256" >> "$GITHUB_OUTPUT"
          printf 'Transform-11 historical-spine audit SHA-256: `%s`\n' "$historical_spine_audit_sha256" >> "$GITHUB_STEP_SUMMARY"
          printf 'identity_record_sha256=%s\n' "$identity_sha256" >> "$GITHUB_OUTPUT"
          printf 'candidate_cutover_observation_sha256=%s\n' "$candidate_cutover_observation_sha256" >> "$GITHUB_OUTPUT"
          printf 'final_routing_observation_sha256=%s\n' "$final_routing_observation_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload production reconciliation evidence
        if: ${{ steps.production-audit-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-reconciliation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-worker-candidate-cutover-observation.json
            ${{ runner.temp }}/production-worker-candidate-cutover.json
            ${{ runner.temp }}/production-worker-final-routing-observation.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload protected production audit evidence
        if: ${{ steps.production-audit-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-primary-source-edge-stabilization.json
            ${{ runner.temp }}/original-language-v2-production-audit.json
            ${{ runner.temp }}/historical-core-production-audit.json
            ${{ runner.temp }}/historical-spine-production-audit.json
            ${{ runner.temp }}/production-worker-deployment-identity.json
            ${{ runner.temp }}/production-worker-candidate-cutover-observation.json
            ${{ runner.temp }}/production-worker-candidate-cutover.json
            ${{ runner.temp }}/production-worker-final-routing-observation.json
          retention-days: 30
          if-no-files-found: error

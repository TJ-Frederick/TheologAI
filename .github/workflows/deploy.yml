name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Short reason for the manual production deployment
        required: true
        type: string
      preview_run_id:
        description: Successful protected PR Checks run for this exact source tree
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  classify-deployment:
    name: Classify Production Deployment
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      baseline: ${{ steps.production-baseline.outputs.baseline }}
      mode: ${{ steps.classify.outputs.mode }}
      before: ${{ steps.classify.outputs.before }}
      merge_base: ${{ steps.classify.outputs.merge_base }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Resolve accepted production baseline
        id: production-baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {resolveProductionBaseline} = require('./.github/scripts/production-baseline.cjs');
            const baseline = await resolveProductionBaseline({github, context});
            core.setOutput('baseline', JSON.stringify(baseline));
      - name: Select release path against the accepted production source
        id: classify
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          PRODUCTION_BASELINE: ${{ steps.production-baseline.outputs.baseline }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s\n' "$PRODUCTION_BASELINE" > "$RUNNER_TEMP/production-baseline.json"
          before="$(jq -er '.productionSource' "$RUNNER_TEMP/production-baseline.json")"
          mode="$(node scripts/release-promotion.mjs classify "$RUNNER_TEMP/production-baseline.json")"
          case "$mode" in application|corpus|docs) ;; *) exit 1 ;; esac
          printf 'mode=%s\nbefore=%s\nmerge_base=%s\n' "$mode" "$before" "$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          printf 'Release path **%s** against `%s`\n' "$mode" "$before" >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate
    needs: classify-deployment
    uses: ./.github/workflows/validate.yml
    with:
      data-lineage-before: ${{ needs.classify-deployment.outputs.before }}

  verify-preview:
    name: Verify Protected Preview
    needs: [classify-deployment, validate]
    if: needs.classify-deployment.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run_id: ${{ steps.preview.outputs.run_id }}
      worker_artifact_id: ${{ steps.preview.outputs.worker_artifact_id }}
      receipt_artifact_id: ${{ steps.preview.outputs.receipt_artifact_id }}
      source_tree: ${{ steps.preview.outputs.source_tree }}
      worker_sha256: ${{ steps.verify.outputs.worker_sha256 }}
      corpus_plan_sha256: ${{ steps.corpus.outputs.sha256 }}
    env:
      RELEASE_MODE: ${{ needs.classify-deployment.outputs.mode }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Resolve successful protected preview and immutable artifact IDs
        id: preview
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {resolvePreview} = require('./.github/scripts/accepted-preview.cjs');
            const pin = await resolvePreview({github,context,runId:context.payload.inputs.preview_run_id});
            core.setOutput('run_id', pin.runId);
            core.setOutput('worker_artifact_id', pin.workerArtifactId);
            core.setOutput('receipt_artifact_id', pin.receiptArtifactId);
            core.setOutput('source_tree', pin.sourceTree);
      - name: Download exact preview-tested Worker by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.preview.outputs.worker_artifact_id }}
          run-id: ${{ steps.preview.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/worker-bundle
          merge-multiple: false
          digest-mismatch: error
      - name: Download exact accepted preview receipt by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.preview.outputs.receipt_artifact_id }}
          run-id: ${{ steps.preview.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/accepted-preview
          merge-multiple: false
          digest-mismatch: error
      - name: Verify accepted preview and exact source tree
        id: verify
        env:
          PREVIEW_TREE: ${{ steps.preview.outputs.source_tree }}
        run: |
          sha="$(sha256sum "$RUNNER_TEMP/worker-bundle/release-manifest.json" | cut -d' ' -f1)"
          node scripts/worker-release-artifact.mjs verify production "$RUNNER_TEMP/worker-bundle" "$sha"
          node scripts/release-promotion.mjs verify "$RELEASE_MODE" "$sha" "$RUNNER_TEMP/accepted-preview/receipt.json" "$PREVIEW_TREE" > "$RUNNER_TEMP/verified-preview.json"
          printf 'worker_sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'Accepted preview run `%s` for Worker manifest `%s` and tree `%s`.\n' "${{ steps.preview.outputs.run_id }}" "$sha" "$PREVIEW_TREE" >> "$GITHUB_STEP_SUMMARY"
          database="$(jq -er '.targets.production.databaseId' release/serving.json)"
          printf 'Intended production D1 `%s` via the **%s** release path.\n' "$database" "$RELEASE_MODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Download protected preview corpus proof source
        if: env.RELEASE_MODE == 'corpus'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-source-${{ steps.preview.outputs.run_id }}-attempt-1
          run-id: ${{ steps.preview.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/corpus-source
          merge-multiple: false
          digest-mismatch: error
      - name: Install tooling for source rebind without cloud credentials
        if: env.RELEASE_MODE == 'corpus'
        uses: ./.github/actions/release-toolchain
      - name: Bind unchanged corpus bytes to the exact approved merge
        if: env.RELEASE_MODE == 'corpus'
        id: corpus
        run: |
          original="$(cat "$RUNNER_TEMP/accepted-preview/corpus-plan.sha256")"
          digest="$(npx --no-install tsx scripts/application-corpus-check.ts rebind --directory "$RUNNER_TEMP/corpus-source" --plan-sha256 "$original")"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Retain exact production corpus verification inputs
        if: env.RELEASE_MODE == 'corpus'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-source-production-${{ github.run_id }}
          path: ${{ runner.temp }}/corpus-source/
          retention-days: 7
          if-no-files-found: error

  operator-authorization:
    name: Admit production operator authorization
    needs: [classify-deployment, verify-preview]
    if: needs.classify-deployment.outputs.mode == 'corpus'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      authorization_sha256: ${{ steps.authorization.outputs.authorization_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for separate explicit production corpus authorization
        id: authorization
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPERATOR_BASE_COMMIT: ${{ needs.classify-deployment.outputs.merge_base }}
          OPERATOR_SOURCE_PLAN_SHA256: ${{ needs.verify-preview.outputs.corpus_plan_sha256 }}
          OPERATOR_WAIT_AUTHORIZATION: 'true'
        with:
          script: |
            await require('./.github/scripts/verify-production-operator-authorization.cjs')({github,context,core});

  deploy:
    name: Test, Build & Deploy
    needs: [classify-deployment, validate, verify-preview, operator-authorization]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      needs.classify-deployment.result == 'success' && needs.validate.result == 'success' &&
      needs.verify-preview.result == 'success' &&
      (needs.classify-deployment.outputs.mode == 'application' ||
       (needs.classify-deployment.outputs.mode == 'corpus' && needs.operator-authorization.result == 'success'))
    concurrency:
      group: theologai-shared-preview-mutation
      cancel-in-progress: false
    environment:
      name: production
      url: https://mcp.theologai.xyz/mcp
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      RELEASE_MODE: ${{ needs.classify-deployment.outputs.mode }}
      WORKER_SHA256: ${{ needs.verify-preview.outputs.worker_sha256 }}
      PRODUCTION_BASELINE: ${{ needs.classify-deployment.outputs.baseline }}
      CORPUS_PLAN_SHA256: ${{ needs.verify-preview.outputs.corpus_plan_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: ./.github/actions/release-toolchain
      - name: Download exact preview-tested Worker by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-preview.outputs.worker_artifact_id }}
          run-id: ${{ needs.verify-preview.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/worker-bundle
          merge-multiple: false
          digest-mismatch: error
      - name: Download exact accepted preview receipt by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-preview.outputs.receipt_artifact_id }}
          run-id: ${{ needs.verify-preview.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/accepted-preview
          merge-multiple: false
          digest-mismatch: error
      - name: Verify accepted preview and exact source tree
        id: verify
        env:
          PREVIEW_TREE: ${{ needs.verify-preview.outputs.source_tree }}
        run: |
          sha="$(sha256sum "$RUNNER_TEMP/worker-bundle/release-manifest.json" | cut -d' ' -f1)"
          node scripts/worker-release-artifact.mjs verify production "$RUNNER_TEMP/worker-bundle" "$sha"
          node scripts/release-promotion.mjs verify "$RELEASE_MODE" "$sha" "$RUNNER_TEMP/accepted-preview/receipt.json" "$PREVIEW_TREE" > "$RUNNER_TEMP/verified-preview.json"
          printf 'worker_sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'Accepted preview run `%s` for Worker manifest `%s` and tree `%s`.\n' "${{ needs.verify-preview.outputs.run_id }}" "$sha" "$PREVIEW_TREE" >> "$GITHUB_STEP_SUMMARY"
      - name: Download exact production corpus verification inputs
        if: env.RELEASE_MODE == 'corpus'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-source-production-${{ github.run_id }}
          path: ${{ runner.temp }}/corpus-source
          merge-multiple: false
          digest-mismatch: error
      - name: Verify immutable Worker and candidate configuration
        run: |
          case "$RELEASE_MODE" in application|corpus) ;; *) exit 1 ;; esac
          printf '%s\n' "$PRODUCTION_BASELINE" > "$RUNNER_TEMP/production-baseline.json"
          test "$(node scripts/release-promotion.mjs classify "$RUNNER_TEMP/production-baseline.json")" = "$RELEASE_MODE"
          node scripts/worker-release-artifact.mjs render production "$RUNNER_TEMP/worker-bundle" "$WORKER_SHA256" "$RUNNER_TEMP/worker-release.json"
          npx --no-install tsx scripts/corpus-execution-config.ts production \
            "$RUNNER_TEMP/corpus-wrangler.toml" "$RUNNER_TEMP/production-baseline.json"
      - name: Recheck owner corpus authority before protected access
        if: env.RELEASE_MODE == 'corpus'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPERATOR_BASE_COMMIT: ${{ needs.classify-deployment.outputs.merge_base }}
          OPERATOR_SOURCE_PLAN_SHA256: ${{ needs.verify-preview.outputs.corpus_plan_sha256 }}
          OPERATOR_EXPECTED_AUTHORIZATION_SHA256: ${{ needs.operator-authorization.outputs.authorization_sha256 }}
        with:
          script: |
            await require('./.github/scripts/verify-production-operator-authorization.cjs')({github,context,core});
      - name: Verify approved source and corpus plan before provider access
        if: env.RELEASE_MODE == 'corpus'
        run: |
          npx --no-install tsx .github/scripts/verify-release-operation.ts owner \
            "$RUNNER_TEMP/corpus-source" "$CORPUS_PLAN_SHA256" "$RUNNER_TEMP/operator-authorization.json"
      - name: Verify accepted preview, candidate D1 and serving assignments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: bash .github/scripts/release-workers.sh preflight production "$RELEASE_MODE"
      - name: Retain matched predecessor before mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-predecessor-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence/*-predecessor*.json
          retention-days: 30
          if-no-files-found: error
      - name: Complete source-bound corpus verification
        if: env.RELEASE_MODE == 'corpus'
        id: corpus-verification
        uses: ./.github/actions/operator-corpus-proof
        with:
          role: production
          source-plan-sha256: ${{ env.CORPUS_PLAN_SHA256 }}
          base-commit: ${{ needs.classify-deployment.outputs.merge_base }}
          output: ${{ runner.temp }}/release-evidence/corpus-readiness.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
      - name: Retain verified corpus before cutover
        if: steps.corpus-verification.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-verified-corpus-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence/corpus-readiness.json
          retention-days: 30
          if-no-files-found: error
      - name: Recheck owner corpus authority before production mutation
        if: env.RELEASE_MODE == 'corpus'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPERATOR_BASE_COMMIT: ${{ needs.classify-deployment.outputs.merge_base }}
          OPERATOR_SOURCE_PLAN_SHA256: ${{ needs.verify-preview.outputs.corpus_plan_sha256 }}
          OPERATOR_EXPECTED_AUTHORIZATION_SHA256: ${{ needs.operator-authorization.outputs.authorization_sha256 }}
        with:
          script: |
            await require('./.github/scripts/verify-production-operator-authorization.cjs')({github,context,core});
      - name: Verify completed proof against the original approved operation
        if: env.RELEASE_MODE == 'corpus'
        run: |
          npx --no-install tsx .github/scripts/verify-release-operation.ts complete \
            "$RUNNER_TEMP/corpus-source" "$CORPUS_PLAN_SHA256" "$RUNNER_TEMP/operator-authorization.json" \
            "$RUNNER_TEMP/operator-corpus-challenge.json" "$RUNNER_TEMP/release-evidence/operator-proof-envelope.json"
      - name: Recheck current main and accepted preview before mutation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKER_ID: ${{ needs.verify-preview.outputs.worker_artifact_id }}
          RECEIPT_ID: ${{ needs.verify-preview.outputs.receipt_artifact_id }}
        with:
          script: |
            const {data: ref} = await github.rest.git.getRef({...context.repo, ref:'heads/main'});
            if (ref.object.sha !== context.sha) throw new Error('Main changed after dispatch');
            const {resolvePreview} = require('./.github/scripts/accepted-preview.cjs');
            const pin = await resolvePreview({github,context,runId:context.payload.inputs.preview_run_id});
            if (String(pin.workerArtifactId) !== process.env.WORKER_ID || String(pin.receiptArtifactId) !== process.env.RECEIPT_ID) throw new Error('Accepted preview pin changed');
      - name: Deploy the verified Worker once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: bash .github/scripts/release-workers.sh deploy production "$RELEASE_MODE"
      - name: Confirm active Worker and D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: bash .github/scripts/release-workers.sh confirm production "$RELEASE_MODE"
      - name: Run two-protocol release smoke
        if: env.RELEASE_MODE == 'application'
        run: |
          version="$(jq -er '.vars.THEOLOGAI_VERSION' "$RUNNER_TEMP/worker-release.json")"
          npx --no-install tsx scripts/release-acceptance.ts --mode application --role production \
            --endpoint https://mcp.theologai.xyz/mcp --version "$version" --search \
            --output "$RUNNER_TEMP/release-evidence/application-smoke.json"
      - name: Run full corpus acceptance in both protocol versions
        if: env.RELEASE_MODE == 'corpus'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install tsx scripts/norton-aquinas-live.ts production \
            "$RUNNER_TEMP/corpus-source" "$CORPUS_PLAN_SHA256" \
            "$RUNNER_TEMP/operator-corpus-challenge.json" "$RUNNER_TEMP/release-evidence/corpus-readiness.json" \
            "$RUNNER_TEMP/release-evidence/production-worker-candidate-cutover.json" "$RUNNER_TEMP/release-evidence"
      - name: Confirm final routing and environment isolation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: bash .github/scripts/release-workers.sh finish production "$RELEASE_MODE"
      - name: Record accepted production source and assignment
        run: bash .github/scripts/release-workers.sh record production "$RELEASE_MODE"
      - name: Observe routing after a stopped mutation
        if: failure() || cancelled()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: bash .github/scripts/release-workers.sh reconcile production "$RELEASE_MODE"
      - name: Retain sanitized release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-evidence/
            ${{ runner.temp }}/operator-corpus-challenge.json.admission.jsonl
          retention-days: 30
          if-no-files-found: warn

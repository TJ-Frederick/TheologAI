name: Validate

on:
  workflow_call:
    inputs:
      data-lineage-before:
        description: Verified previous production commit used for historical section-key lineage.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/validate
        with:
          suite: core
          data-lineage-before: ${{ inputs.data-lineage-before }}

  fresh-checkout-data:
    name: Fresh Checkout & Data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/validate
        with:
          suite: data
          data-lineage-before: ${{ inputs.data-lineage-before }}

  worker-runtime:
    name: Worker Runtime & D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/validate
        with:
          suite: worker
          data-lineage-before: ${{ inputs.data-lineage-before }}

  node-http-e2e:
    name: Node HTTP E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/validate
        with:
          suite: node
          data-lineage-before: ${{ inputs.data-lineage-before }}

  mcp-conformance:
    name: Applicable MCP Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/validate
        with:
          suite: conformance
          data-lineage-before: ${{ inputs.data-lineage-before }}
      - name: Upload MCP conformance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-conformance-results
          path: test-output/mcp-conformance/
          if-no-files-found: error

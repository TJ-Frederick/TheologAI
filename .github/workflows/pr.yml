name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:
    inputs:
      operator_authorization_json:
        description: Explicit new one-operation owner authorization; no inherited or renewed budget
        type: string
        default: ""
      operator_proof_json:
        description: Sanitized complete proof submitted by the existing operator
        type: string
        default: ""

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'deploy-preview') &&
        format('pr-{0}', github.event.pull_request.number) || format('validation-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '') && 'Operator metadata / Select Validation' || 'Select Validation' }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      data: ${{ steps.select.outputs.data }}
      serving: ${{ steps.select.outputs.serving }}
      tested_tree: ${{ steps.select.outputs.tested_tree }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - id: select
        name: Classify exact checked-out change
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EXPECTED_HEAD: ${{ github.sha }}
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_FORCE_FULL: ${{ github.event_name != 'pull_request' || github.event.action == 'labeled' || contains(github.event.pull_request.labels.*.name, 'deploy-preview') }}
        run: |
          node scripts/classify-ci-changes.mjs
          printf 'tested_tree=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

  test-and-build:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '') && 'Operator metadata / Test & Build' || 'Test & Build' }}
    needs: classify
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/validate
        with:
          suite: ${{ needs.classify.outputs.mode == 'docs' && 'docs' || 'core' }}
          selected: 'true'
          classifier-result: ${{ needs.classify.result }}
          selection-mode: ${{ needs.classify.outputs.mode }}

  fresh-checkout-data:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '') && 'Operator metadata / Fresh Checkout & Data' || 'Fresh Checkout & Data' }}
    needs: classify
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/validate
        with:
          suite: data
          selected: '${{ needs.classify.outputs.data }}'
          classifier-result: ${{ needs.classify.result }}
          selection-mode: ${{ needs.classify.outputs.mode }}

  worker-runtime:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '') && 'Operator metadata / Worker Runtime & D1' || 'Worker Runtime & D1' }}
    needs: classify
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/validate
        with:
          suite: worker
          selected: '${{ needs.classify.outputs.serving }}'
          classifier-result: ${{ needs.classify.result }}
          selection-mode: ${{ needs.classify.outputs.mode }}

  node-http-e2e:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '') && 'Operator metadata / Node HTTP E2E' || 'Node HTTP E2E' }}
    needs: classify
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/validate
        with:
          suite: node
          selected: '${{ needs.classify.outputs.serving }}'
          classifier-result: ${{ needs.classify.result }}
          selection-mode: ${{ needs.classify.outputs.mode }}

  mcp-conformance:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '') && 'Operator metadata / Applicable MCP Conformance' || 'Applicable MCP Conformance' }}
    needs: classify
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/validate
        with:
          suite: conformance
          selected: '${{ needs.classify.outputs.serving }}'
          classifier-result: ${{ needs.classify.result }}
          selection-mode: ${{ needs.classify.outputs.mode }}
      - name: Upload MCP conformance results
        if: always() && needs.classify.outputs.serving == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-conformance-results
          path: test-output/mcp-conformance/
          if-no-files-found: error

  validation-complete:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '') && 'Operator metadata / Validation Complete' || 'Validation Complete' }}
    needs: [test-and-build, fresh-checkout-data, worker-runtime, node-http-e2e, mcp-conformance]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && (inputs.operator_proof_json != '' || inputs.operator_authorization_json != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every named check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success,success,success'

  classify-release:
    name: Classify PR Release
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      baseline: ${{ steps.production-baseline.outputs.baseline }}
      mode: ${{ steps.release.outputs.mode }}
      tested_tree: ${{ steps.release.outputs.tested_tree }}
      same_tree: ${{ steps.release.outputs.same_tree }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Resolve accepted production baseline
        id: production-baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {resolveProductionBaseline} = require('./.github/scripts/production-baseline.cjs');
            const baseline = await resolveProductionBaseline({github, context});
            core.setOutput('baseline', JSON.stringify(baseline));
      - name: Classify the exact PR merge against accepted production
        id: release
        env:
          CI_EXPECTED_HEAD: ${{ github.sha }}
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PRODUCTION_BASELINE: ${{ steps.production-baseline.outputs.baseline }}
        run: |
          printf '%s\n' "$PRODUCTION_BASELINE" > "$RUNNER_TEMP/production-baseline.json"
          node scripts/release-promotion.mjs classify-pr "$RUNNER_TEMP/production-baseline.json"

  release-eligibility:
    name: Release Eligibility
    needs: [classify-release, validation-complete, preview-deploy]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - name: Explain exact candidate release eligibility
        env:
          CI_RELEASE_CLASSIFICATION_RESULT: ${{ needs.classify-release.result }}
          CI_RELEASE_MODE: ${{ needs.classify-release.outputs.mode }}
          CI_RELEASE_SAME_TREE: ${{ needs.classify-release.outputs.same_tree }}
          CI_VALIDATION_RESULT: ${{ needs.validation-complete.result }}
          CI_PREVIEW_RESULT: ${{ needs.preview-deploy.result }}
        run: node scripts/pr-release-eligibility.mjs


  build-worker:
    name: Build preview Worker artifact (no cloud credentials)
    needs: [classify, classify-release, validation-complete]
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy-preview') &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy-preview') &&
      github.run_attempt == 1 &&
      needs.validation-complete.result == 'success' &&
      needs.classify-release.result == 'success' &&
      (needs.classify-release.outputs.mode == 'application' || needs.classify-release.outputs.mode == 'corpus')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_MODE: ${{ needs.classify-release.outputs.mode }}
      PRODUCTION_BASELINE: ${{ needs.classify-release.outputs.baseline }}
    outputs:
      worker_sha256: ${{ steps.worker.outputs.sha256 }}
      worker_artifact_id: ${{ steps.worker-upload.outputs.artifact-id }}
      corpus_plan_sha256: ${{ steps.corpus.outputs.sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require the exact CI-tested tree
        env:
          TESTED_TREE: ${{ needs.classify.outputs.tested_tree }}
          CLASSIFIED_TREE: ${{ needs.classify-release.outputs.tested_tree }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$TESTED_TREE"
          test "$TESTED_TREE" = "$CLASSIFIED_TREE"
          baseline="$(jq -er '.productionSource' <<< "$PRODUCTION_BASELINE")"
          git merge-base --is-ancestor "$baseline" HEAD
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --ignore-scripts --no-audit
      - name: Prepare source for complete corpus verification
        if: env.RELEASE_MODE == 'corpus'
        id: corpus
        run: |
          npm rebuild better-sqlite3 --ignore-scripts=false
          npm run build:db
          digest="$(npx --no-install tsx scripts/application-corpus-check.ts prepare --database data/theologai.db --directory "$RUNNER_TEMP/corpus-source")"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Retain source for complete corpus verification
        if: env.RELEASE_MODE == 'corpus'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-source-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/corpus-source/
          if-no-files-found: error
          retention-days: 7
      - name: Build and seal the Worker
        id: worker
        run: |
          npx --no-install wrangler deploy --dry-run --env-file /dev/null --outdir "$RUNNER_TEMP/worker-bundle"
          digest="$(node scripts/worker-release-artifact.mjs create preview "$RUNNER_TEMP/worker-bundle")"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          database="$(jq -er '.targets.preview.databaseId' release/serving.json)"
          printf 'Preview Worker manifest `%s`, tree `%s`, D1 `%s`.\n' \
            "$digest" "$(git rev-parse HEAD^{tree})" "$database" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise the exact Worker on local Workerd
        run: |
          if [[ "$RELEASE_MODE" != corpus ]]; then
            npm rebuild better-sqlite3 --ignore-scripts=false
            npm run build:db
          fi
          version="$(jq -er '.version' package.json)"
          npx --no-install tsx scripts/release-acceptance.ts --mode "$RELEASE_MODE" --role preview \
            --endpoint https://worker.test/mcp --version "$version-preview" --search \
            --database data/theologai.db --bundle "$RUNNER_TEMP/worker-bundle/worker.js" \
            --output "$RUNNER_TEMP/local-release-acceptance.json"
      - name: Retain exact local Worker acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-release-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/local-release-acceptance.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain immutable Worker
        id: worker-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-worker-${{ github.run_id }}
          path: ${{ runner.temp }}/worker-bundle/
          if-no-files-found: error
          retention-days: 7
  operator-proof-source:
    name: Verify operator proof source (no cloud credentials)
    needs: [classify-release, build-worker, validation-complete]
    if: needs.classify-release.outputs.mode == 'corpus'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      RELEASE_MODE: ${{ needs.classify-release.outputs.mode }}
      PRODUCTION_BASELINE: ${{ needs.classify-release.outputs.baseline }}
    outputs:
      source: ${{ steps.source.outputs.source }}
      tree: ${{ steps.source.outputs.tree }}
      base: ${{ steps.source.outputs.base }}
      authorization_sha256: ${{ steps.source.outputs.authorization_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record the classification used for this corpus source
        run: |
          baseline="$(jq -er '.productionSource' <<< "$PRODUCTION_BASELINE")"
          printf 'Source proof for **%s** release against `%s`.\n' "$RELEASE_MODE" "$baseline" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/release-toolchain
      - name: Verify normal CI and live operator-proof authorization
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPERATOR_WAIT_AUTHORIZATION: 'true'
          OPERATOR_SOURCE_RUN_ID: ${{ github.run_id }}
          OPERATOR_SOURCE_PLAN_SHA256: ${{ needs.build-worker.outputs.corpus_plan_sha256 }}
        with:
          script: |
            await require('./.github/scripts/verify-operator-proof-source.cjs')({github, context, core});

  operator-proof-upload:
    name: Retain operator corpus proof (no cloud credentials)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operator_proof_json != '' && inputs.operator_authorization_json == '' && github.actor_id == '40179660' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Retain bounded owner submission
        id: envelope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPERATOR_PROOF_JSON: ${{ inputs.operator_proof_json }}
        with:
          script: require('./.github/scripts/operator-proof-bridge.cjs').upload({context,core});
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.envelope.outputs.artifact_name }}
          path: ${{ runner.temp }}/operator-proof-envelope.json
          retention-days: 7
          if-no-files-found: error

  operator-authorization-upload:
    name: Retain operator operation authorization (no cloud credentials)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operator_authorization_json != '' && inputs.operator_proof_json == '' && github.actor_id == '40179660' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Retain explicit one-operation owner authorization
        id: authorization
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPERATOR_AUTHORIZATION_JSON: ${{ inputs.operator_authorization_json }}
        with:
          script: await require('./.github/scripts/operator-authorization.cjs').uploadAuthorization({github,context,core});
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.authorization.outputs.artifact_name }}
          path: ${{ runner.temp }}/operator-authorization.json
          retention-days: 7
          if-no-files-found: error
          overwrite: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-ledger-${{ fromJSON(inputs.operator_authorization_json).ledgerId }}
          path: ${{ runner.temp }}/operator-authorization.json
          retention-days: 7

  preview-deploy:
    name: Deploy Preview
    needs: [classify-release, validation-complete, build-worker, operator-proof-source]
    if: >-
      !cancelled() && needs.validation-complete.result == 'success' &&
      needs.classify-release.result == 'success' &&
      needs.build-worker.result == 'success' &&
      (needs.classify-release.outputs.mode == 'application' ||
       (needs.classify-release.outputs.mode == 'corpus' && needs.operator-proof-source.result == 'success'))
    concurrency:
      group: theologai-shared-preview-mutation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: preview
      url: https://preview-mcp.theologai.xyz/mcp
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      RELEASE_MODE: ${{ needs.classify-release.outputs.mode }}
      WORKER_SHA256: ${{ needs.build-worker.outputs.worker_sha256 }}
      PRODUCTION_BASELINE: ${{ needs.classify-release.outputs.baseline }}
      CORPUS_PLAN_SHA256: ${{ needs.build-worker.outputs.corpus_plan_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm live preview authorization before protected access
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/preview-release-authorization.cjs')({github,context});
      # The separately locked release toolchain comes from the protected base.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: test-output/release-control
          persist-credentials: false
      - name: Select release toolchain source
        id: release-toolchain-source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/actions/release-toolchain/action.yml
            .github/release-toolchain/package.json
            .github/release-toolchain/package-lock.json
          )
          base_files=0
          for file in "${files[@]}"; do
            if test -e "test-output/release-control/$file" || test -L "test-output/release-control/$file"; then
              test -f "test-output/release-control/$file"
              test ! -L "test-output/release-control/$file"
              base_files=$((base_files + 1))
            fi
          done
          case "$base_files" in
            3) printf 'source=base\n' >> "$GITHUB_OUTPUT" ;;
            0)
              # Bootstrap only an entirely absent trust set; missing individual
              # files in an established base never permit a candidate fallback.
              for file in "${files[@]}"; do
                test -f "$file"
                test ! -L "$file"
              done
              printf 'source=introduction\n' >> "$GITHUB_OUTPUT"
              echo '::notice::Using the separately locked release toolchain introduced by this approved PR.'
              ;;
            *) echo '::error::The protected base has an incomplete release toolchain.'; exit 1 ;;
          esac

      - if: steps.release-toolchain-source.outputs.source == 'base'
        uses: ./test-output/release-control/.github/actions/release-toolchain

      - if: steps.release-toolchain-source.outputs.source == 'introduction'
        uses: ./.github/actions/release-toolchain

      - name: Download the immutable Worker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-worker.outputs.worker_artifact_id }}
          path: ${{ runner.temp }}/worker-bundle
          merge-multiple: false
          digest-mismatch: error
      - name: Download the exact corpus proof source
        if: env.RELEASE_MODE == 'corpus'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-source-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/corpus-source
          merge-multiple: false
          digest-mismatch: error
      - name: Verify immutable Worker and candidate configuration
        run: |
          case "$RELEASE_MODE" in application|corpus) ;; *) exit 1 ;; esac
          printf '%s\n' "$PRODUCTION_BASELINE" > "$RUNNER_TEMP/production-baseline.json"
          test "$(node scripts/release-promotion.mjs classify "$RUNNER_TEMP/production-baseline.json")" = "$RELEASE_MODE"
          node scripts/worker-release-artifact.mjs render preview "$RUNNER_TEMP/worker-bundle" "$WORKER_SHA256" "$RUNNER_TEMP/worker-release.json"
          npx --no-install tsx scripts/corpus-execution-config.ts preview \
            "$RUNNER_TEMP/corpus-wrangler.toml" "$RUNNER_TEMP/production-baseline.json"
      - name: Recheck admitted owner corpus authority
        if: env.RELEASE_MODE == 'corpus'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPERATOR_EXPECTED_AUTHORIZATION_SHA256: ${{ needs.operator-proof-source.outputs.authorization_sha256 }}
          OPERATOR_SOURCE_RUN_ID: ${{ github.run_id }}
          OPERATOR_SOURCE_PLAN_SHA256: ${{ env.CORPUS_PLAN_SHA256 }}
        with:
          script: |
            await require('./.github/scripts/verify-operator-proof-source.cjs')({github,context,core});
      - name: Verify approved source and corpus plan before provider access
        if: env.RELEASE_MODE == 'corpus'
        run: |
          npx --no-install tsx .github/scripts/verify-release-operation.ts owner \
            "$RUNNER_TEMP/corpus-source" "$CORPUS_PLAN_SHA256" "$RUNNER_TEMP/operator-authorization.json"
      - name: Verify candidate D1 and capture serving assignments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: bash .github/scripts/release-workers.sh preflight preview "$RELEASE_MODE"
      - name: Retain matched predecessor before mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-release-predecessor-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence/*-predecessor*.json
          retention-days: 30
          if-no-files-found: error
      - name: Complete source-bound corpus verification
        if: env.RELEASE_MODE == 'corpus'
        id: corpus-verification
        uses: ./.github/actions/operator-corpus-proof
        with:
          role: preview
          source-plan-sha256: ${{ env.CORPUS_PLAN_SHA256 }}
          base-commit: ${{ needs.operator-proof-source.outputs.base }}
          output: ${{ runner.temp }}/release-evidence/corpus-readiness.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
      - name: Retain verified corpus before cutover
        if: steps.corpus-verification.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-verified-corpus-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence/corpus-readiness.json
          retention-days: 30
          if-no-files-found: error
      - name: Recheck owner corpus authority before preview mutation
        if: env.RELEASE_MODE == 'corpus'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPERATOR_EXPECTED_AUTHORIZATION_SHA256: ${{ needs.operator-proof-source.outputs.authorization_sha256 }}
          OPERATOR_SOURCE_RUN_ID: ${{ github.run_id }}
          OPERATOR_SOURCE_PLAN_SHA256: ${{ env.CORPUS_PLAN_SHA256 }}
        with:
          script: |
            await require('./.github/scripts/verify-operator-proof-source.cjs')({github,context,core});
      - name: Verify completed proof against the original approved operation
        if: env.RELEASE_MODE == 'corpus'
        run: |
          npx --no-install tsx .github/scripts/verify-release-operation.ts complete \
            "$RUNNER_TEMP/corpus-source" "$CORPUS_PLAN_SHA256" "$RUNNER_TEMP/operator-authorization.json" \
            "$RUNNER_TEMP/operator-corpus-challenge.json" "$RUNNER_TEMP/release-evidence/operator-proof-envelope.json"
      - name: Recheck live preview authorization before mutation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/preview-release-authorization.cjs')({github,context});
      - name: Deploy the verified Worker once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: bash .github/scripts/release-workers.sh deploy preview "$RELEASE_MODE"
      - name: Confirm active Worker and D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: bash .github/scripts/release-workers.sh confirm preview "$RELEASE_MODE"
      - name: Run two-protocol release smoke
        if: env.RELEASE_MODE == 'application'
        run: |
          version="$(jq -er '.vars.THEOLOGAI_VERSION' "$RUNNER_TEMP/worker-release.json")"
          npx --no-install tsx scripts/release-acceptance.ts --mode application --role preview \
            --endpoint https://preview-mcp.theologai.xyz/mcp --version "$version" --search \
            --output "$RUNNER_TEMP/release-evidence/application-smoke.json"
      - name: Verify serving corpus in both protocol versions with bounded recovery
        if: env.RELEASE_MODE == 'corpus'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: bash .github/scripts/release-workers.sh audit-corpus preview "$RELEASE_MODE"
      - name: Confirm final routing and environment isolation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: bash .github/scripts/release-workers.sh finish preview "$RELEASE_MODE"
      - name: Observe routing after a stopped mutation
        if: failure() || cancelled()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: bash .github/scripts/release-workers.sh reconcile preview "$RELEASE_MODE"
      - name: Recheck preview authorization before recording acceptance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/preview-release-authorization.cjs')({github,context});
      - name: Record accepted preview for the exact bundle
        run: |
          mkdir "$RUNNER_TEMP/accepted-preview"
          audit="$RUNNER_TEMP/release-evidence/application-smoke.json"
          if [[ "$RELEASE_MODE" == corpus ]]; then
            audit="$RUNNER_TEMP/release-evidence/corpus-live.json"
            printf '%s\n' "$CORPUS_PLAN_SHA256" > "$RUNNER_TEMP/accepted-preview/corpus-plan.sha256"
          fi
          node scripts/release-promotion.mjs record "$RELEASE_MODE" "$WORKER_SHA256" "$audit" \
            "$RUNNER_TEMP/accepted-preview/receipt.json" \
            "$RUNNER_TEMP/release-evidence/preview-worker-deployment-identity.json" \
            "$RUNNER_TEMP/release-evidence/preview-worker-candidate-cutover.json"
      - name: Retain accepted preview receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted-preview/
          retention-days: 7
          if-no-files-found: error
      - name: Retain sanitized release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-release-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-evidence/
            ${{ runner.temp }}/operator-corpus-challenge.json.admission.jsonl
          retention-days: 30
          if-no-files-found: warn

name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:
    inputs:
      operator_proof_json:
        description: Sanitized complete proof submitted by the existing operator
        type: string
        default: ""

# Unrelated labels cannot cancel active validation or preview transactions.
# Required checks still execute: emitting skipped contexts on a label event
# could otherwise supersede a failing required check for the same revision.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'deploy-preview') &&
        format('pr-{0}', github.event.pull_request.number) || format('validation-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Select Validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      data: ${{ steps.select.outputs.data }}
      serving: ${{ steps.select.outputs.serving }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - id: select
        name: Classify exact checked-out change
        env:
          CI_EXPECTED_HEAD: ${{ github.sha }}
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_FORCE_FULL: ${{ github.event_name != 'pull_request' || github.event.action == 'labeled' || contains(github.event.pull_request.labels.*.name, 'deploy-preview') }}
        run: node scripts/classify-ci-changes.mjs

  test-and-build:
    name: Test & Build
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit validation selection
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.serving }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          case "$SELECTED" in true|false) ;; *) exit 1 ;; esac

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The complete operator-handoff regression classifies against the
          # immutable deployed baseline, just like the release artifact jobs.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --no-audit
      - uses: ./.github/actions/validate
        with:
          suite: ${{ needs.classify.outputs.mode == 'docs' && 'docs' || 'core' }}

  fresh-checkout-data:
    name: Fresh Checkout & Data
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require explicit validation selection
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.data }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          case "$SELECTED" in true|false) ;; *) exit 1 ;; esac

      - if: needs.classify.outputs.data == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - if: needs.classify.outputs.data == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --no-audit
        if: needs.classify.outputs.data == 'true'
      - name: Verify historical section-key lineage
        if: needs.classify.outputs.data == 'true' && github.event_name == 'pull_request'
        env:
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for sha in "$EXPECTED_MERGE_SHA" "$EXPECTED_HEAD_SHA"; do
            printf '%s\n' "$sha" | grep -Eq '^[0-9a-fA-F]{40}$'
            git cat-file -e "$sha^{commit}"
          done

          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_MERGE_SHA"
          set -- $(git rev-list --parents -n 1 HEAD)
          test "$#" -eq 3
          test "$1" = "$checked_out_sha"
          BASE_SHA="$2"
          CANDIDATE_HEAD_SHA="$3"

          for sha in "$BASE_SHA" "$CANDIDATE_HEAD_SHA"; do
            printf '%s\n' "$sha" | grep -Eq '^[0-9a-fA-F]{40}$'
            git cat-file -e "$sha^{commit}"
          done
          test "$CANDIDATE_HEAD_SHA" = "$EXPECTED_HEAD_SHA"

          if git cat-file -e "$BASE_SHA:data/historical-section-key-plan.json"; then
            git show "$BASE_SHA:data/historical-section-key-plan.json" > "$RUNNER_TEMP/historical-section-key-plan.previous.json"
            npm run data:verify-section-keys -- --previous-plan "$RUNNER_TEMP/historical-section-key-plan.previous.json"
          else
            npm run data:verify-section-keys -- --genesis
          fi

      - name: Verify scheduled historical section-key plan
        if: needs.classify.outputs.data == 'true' && github.event_name != 'pull_request'
        run: |
          if git cat-file -e 'HEAD^1:data/historical-section-key-plan.json'; then
            git show 'HEAD^1:data/historical-section-key-plan.json' > "$RUNNER_TEMP/historical-section-key-plan.previous.json"
            npm run data:verify-section-keys -- --previous-plan "$RUNNER_TEMP/historical-section-key-plan.previous.json"
          else
            npm run data:verify-section-keys -- --genesis
          fi
      - uses: ./.github/actions/validate
        if: needs.classify.outputs.data == 'true'
        with:
          suite: data
      - name: Record intentional omission
        if: needs.classify.outputs.data == 'false'
        run: echo 'This change does not affect this validation suite; the required check remains explicit.'

  worker-runtime:
    name: Worker Runtime & D1
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit validation selection
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.serving }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          case "$SELECTED" in true|false) ;; *) exit 1 ;; esac

      - if: needs.classify.outputs.serving == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - if: needs.classify.outputs.serving == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --no-audit
        if: needs.classify.outputs.serving == 'true'
      - uses: ./.github/actions/validate
        if: needs.classify.outputs.serving == 'true'
        with:
          suite: worker
      - name: Record intentional omission
        if: needs.classify.outputs.serving == 'false'
        run: echo 'This change does not affect this validation suite; the required check remains explicit.'

  node-http-e2e:
    name: Node HTTP E2E
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit validation selection
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.serving }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          case "$SELECTED" in true|false) ;; *) exit 1 ;; esac

      - if: needs.classify.outputs.serving == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - if: needs.classify.outputs.serving == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --no-audit
        if: needs.classify.outputs.serving == 'true'
      - uses: ./.github/actions/validate
        if: needs.classify.outputs.serving == 'true'
        with:
          suite: node
      - name: Record intentional omission
        if: needs.classify.outputs.serving == 'false'
        run: echo 'This change does not affect this validation suite; the required check remains explicit.'

  mcp-conformance:
    name: Applicable MCP Conformance
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit validation selection
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.serving }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          case "$SELECTED" in true|false) ;; *) exit 1 ;; esac

      - if: needs.classify.outputs.serving == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - if: needs.classify.outputs.serving == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --no-audit
        if: needs.classify.outputs.serving == 'true'
      - uses: ./.github/actions/validate
        if: needs.classify.outputs.serving == 'true'
        with:
          suite: conformance
      - name: Record intentional omission
        if: needs.classify.outputs.serving == 'false'
        run: echo 'This change does not affect this validation suite; the required check remains explicit.'
      - name: Upload MCP conformance results
        if: always() && needs.classify.outputs.serving == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-conformance-results
          path: test-output/mcp-conformance/
          if-no-files-found: error

  validation-complete:
    name: Validation Complete
    needs: [test-and-build, fresh-checkout-data, worker-runtime, node-http-e2e, mcp-conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every named check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success,success,success'

  release-eligibility:
    name: Release Eligibility
    needs: [classify, validation-complete, preview-deploy]
    if: ${{ always() && github.event_name == 'pull_request' && needs.classify.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - name: Explain exact candidate release eligibility
        env:
          CI_EXPECTED_HEAD: ${{ github.sha }}
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_VALIDATION_RESULT: ${{ needs.validation-complete.result }}
          CI_PREVIEW_RESULT: ${{ needs.preview-deploy.result }}
        run: node scripts/pr-release-eligibility.mjs

  build-worker:
    name: Build preview Worker artifact (no cloud credentials)
    needs: validation-complete
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'deploy-preview') &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      worker_sha256: ${{ steps.worker-artifact.outputs.sha256 }}
      corpus_plan_sha256: ${{ steps.corpus-source.outputs.sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --ignore-scripts --no-audit

      - name: Prepare complete corpus proof source without cloud credentials
        if: hashFiles('release/application-only.json') != ''
        id: corpus-source
        run: |
          npm rebuild better-sqlite3 --ignore-scripts=false
          npm run build:db
          digest="$(npx --no-install tsx scripts/application-corpus-check.ts prepare --database data/theologai.db --directory "$RUNNER_TEMP/corpus-source")"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload source-bound corpus proof inputs
        if: steps.corpus-source.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-preview-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/corpus-source/
          if-no-files-found: error
          retention-days: 1
          overwrite: false

      - name: Build Worker without cloud credentials
        run: |
          npx --no-install wrangler deploy --dry-run --env preview --env-file /dev/null --outdir "$RUNNER_TEMP/worker-bundle"
      - name: Bind Worker artifact to exact source
        id: worker-artifact
        run: |
          digest="$(node scripts/worker-release-artifact.mjs create preview "$RUNNER_TEMP/worker-bundle")"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-preview-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-bundle/
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  preview-deploy:
    name: Deploy Preview
    needs: [validation-complete, build-worker, operator-corpus-proof]
    if: >-
      !cancelled() && needs.validation-complete.result == 'success' && needs.build-worker.result == 'success' &&
      (github.event.pull_request.number != 167 || needs.operator-corpus-proof.result == 'success') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy-preview') &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    # Repository-wide serialization: this exact group is also held by the
    # manual CCEL canary and emergency restore, so neither can observe or
    # overwrite an ordinary preview deployment mid-transaction.
    concurrency:
      group: theologai-shared-preview-mutation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: preview
      url: https://preview-mcp.theologai.xyz/mcp
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Confirm live preview authorization before using environment secrets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const labels = pullRequest.labels.map(label => label.name);
            const failures = [];

            if (pullRequest.state !== 'open') failures.push('the pull request is no longer open');
            if (pullRequest.draft) failures.push('the pull request is now a draft');
            if (pullRequest.base.ref !== 'main') failures.push('the pull request no longer targets main');
            if (pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              failures.push('the pull request no longer has a same-repository head');
            }
            if (!labels.includes('deploy-preview')) failures.push('the deploy-preview label is absent');
            if (pullRequest.head.sha !== context.payload.pull_request.head.sha) {
              failures.push('the pull request head changed after this workflow started');
            }

            if (failures.length > 0) {
              core.setFailed(`Preview authorization revoked: ${failures.join('; ')}.`);
            }

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify preview checkout identity
        id: preview-checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          checked_out_commit="$(git rev-parse HEAD)"
          checked_out_tree="$(git rev-parse HEAD^{tree})"
          if test "$checked_out_commit" != "$EXPECTED_HEAD_SHA"; then
            echo "::error::Preview checkout does not match the authorized pull-request head. Expected $EXPECTED_HEAD_SHA, got $checked_out_commit."
            exit 1
          fi
          printf 'commit=%s\n' "$checked_out_commit" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$checked_out_tree" >> "$GITHUB_OUTPUT"

      # Prefer the protected base's release trust set. Its first introduction
      # must pass the same validation, label, live-head and preview approval
      # gates as every candidate; it never installs the root dependency graph.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: release-control
          persist-credentials: false
      - name: Select release toolchain source
        id: release-toolchain-source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/actions/release-toolchain/action.yml
            .github/release-toolchain/package.json
            .github/release-toolchain/package-lock.json
          )
          base_files=0
          for file in "${files[@]}"; do
            if test -e "release-control/$file" || test -L "release-control/$file"; then
              test -f "release-control/$file"
              test ! -L "release-control/$file"
              base_files=$((base_files + 1))
            fi
          done
          case "$base_files" in
            3) printf 'source=base\n' >> "$GITHUB_OUTPUT" ;;
            0)
              # Bootstrap only an entirely absent trust set; missing individual
              # files in an established base never permit a candidate fallback.
              for file in "${files[@]}"; do
                test -f "$file"
                test ! -L "$file"
              done
              printf 'source=introduction\n' >> "$GITHUB_OUTPUT"
              echo '::notice::Using the separately locked release toolchain introduced by this approved PR.'
              ;;
            *) echo '::error::The protected base has an incomplete release toolchain.'; exit 1 ;;
          esac

      - if: steps.release-toolchain-source.outputs.source == 'base'
        uses: ./release-control/.github/actions/release-toolchain

      - if: steps.release-toolchain-source.outputs.source == 'introduction'
        uses: ./.github/actions/release-toolchain

      - name: Download source-bound Worker artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker-preview-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-bundle
          merge-multiple: false
          digest-mismatch: error
      - name: Download source-bound complete corpus proof inputs
        if: hashFiles('release/application-only.json') != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-preview-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/corpus-source
          merge-multiple: false
          digest-mismatch: error
      - name: Verify artifact and render upload-only configuration
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-worker.outputs.worker_sha256 }}
        run: |
          node scripts/worker-release-artifact.mjs render preview "$RUNNER_TEMP/worker-bundle" "$EXPECTED_MANIFEST_SHA256" "$RUNNER_TEMP/worker-release.json"

      # Resolve the checked-out candidate by ID and name before readiness.
      # The Worker remains bound to the predecessor until the later deploy.
      - name: Capture checked-out candidate preview D1 mapping (read-only)
        run: |
          npx --no-install wrangler d1 list --json > "$RUNNER_TEMP/preview-d1-inventory.json"
          npx --no-install tsx scripts/preview-release-reconciliation.ts candidate-d1-name \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/preview-d1-inventory.json" \
            > "$RUNNER_TEMP/preview-candidate-d1-name.txt"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Download protected operator proof for this preview run
        if: github.event.pull_request.number == 167 && hashFiles('release/application-only.json') != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-operator-verified-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operator-verified
          merge-multiple: false
          digest-mismatch: error

      # The approved operator completes every check; this protected job revalidates
      # its source-bound receipt and current controls without repeating its SQL.
      - name: Verify fresh corpus (up to 3.8M reads and four integrity commands)
        id: corpus-proof
        run: |
          candidate_d1_name="$(< "$RUNNER_TEMP/preview-candidate-d1-name.txt")"
          if test -f release/application-only.json; then
            test "$(sha256sum "$RUNNER_TEMP/operator-verified/operator-proof-envelope.json" | cut -d' ' -f1)" = "$EXPECTED_OPERATOR_ENVELOPE_SHA256"
            npx --no-install tsx scripts/operator-corpus-proof.ts accept \
              "$RUNNER_TEMP/operator-verified/operator-corpus-challenge.json" \
              "$RUNNER_TEMP/operator-verified/operator-proof-envelope.json" \
              "$RUNNER_TEMP/corpus-source" "$CORPUS_PLAN_SHA256" "$RUNNER_TEMP/preview-d1-readiness-receipt.json"
          else
            npx --no-install tsx scripts/check-remote-d1-readiness.ts --database "$candidate_d1_name" --env preview \
              --output "$RUNNER_TEMP/preview-d1-readiness-receipt.json"
          fi
        env:
          EXPECTED_OPERATOR_ENVELOPE_SHA256: ${{ needs.operator-corpus-proof.outputs.envelope_sha256 }}
          CORPUS_PLAN_SHA256: ${{ needs.build-worker.outputs.corpus_plan_sha256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload sanitized preview D1 readiness receipt
        if: always() && steps.corpus-proof.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-d1-readiness-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/preview-d1-readiness-receipt.json
            ${{ runner.temp }}/preview-d1-readiness-receipt.json.events.jsonl
            ${{ runner.temp }}/preview-d1-readiness-receipt.json.controls.jsonl
            ${{ runner.temp }}/operator-verified/operator-proof-envelope.json
            ${{ runner.temp }}/operator-verified/operator-corpus-challenge.json
            ${{ runner.temp }}/corpus-source/plan.json
          retention-days: 7
          if-no-files-found: error

      # This is evidence only. It cannot deploy, roll back, bind, seed, or
      # delete; a later failure/revocation still leaves a manual recovery path.
      - name: Capture preview predecessor reconciliation anchor (read-only)
        id: preview-predecessor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler deployments list --env preview --json > "$RUNNER_TEMP/preview-worker-deployments-predecessor.json"
          predecessor_version="$(npx --no-install tsx scripts/preview-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/preview-worker-deployments-predecessor.json")"
          npx --no-install wrangler versions view "$predecessor_version" --env preview --json > "$RUNNER_TEMP/preview-worker-predecessor-version-view.json"
          npx --no-install tsx scripts/preview-release-reconciliation.ts capture-predecessor \
            --deployments "$RUNNER_TEMP/preview-worker-deployments-predecessor.json" \
            --predecessor-version-view "$RUNNER_TEMP/preview-worker-predecessor-version-view.json" \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/preview-d1-inventory.json" \
            --output "$RUNNER_TEMP/preview-worker-predecessor-anchor.json"

      # Retain the predecessor before mutation so a later job cancellation
      # cannot discard the exact manual recovery target.
      - name: Upload preview predecessor reconciliation anchor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-release-predecessor-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/preview-worker-predecessor-anchor.json
          retention-days: 7
          if-no-files-found: error

      # An ordinary preview release may not change production. Capture a fixed
      # read-only production control before the preview mutation and compare it
      # again after deployment, before any preview audit can begin.
      - name: Capture production control before preview deployment (read-only)
        id: production-control-before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler d1 list --json > "$RUNNER_TEMP/production-control-d1-inventory-before.json"
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-control-deployments-before.json"
          production_control_version="$(npx --no-install tsx scripts/production-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/production-control-deployments-before.json")"
          npx --no-install wrangler versions view "$production_control_version" --json \
            > "$RUNNER_TEMP/production-control-version-before.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts capture-control \
            --deployments "$RUNNER_TEMP/production-control-deployments-before.json" \
            --active-version-view "$RUNNER_TEMP/production-control-version-before.json" \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/production-control-d1-inventory-before.json" \
            --output "$RUNNER_TEMP/production-control-before.json"

      - name: Upload production control before preview deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-production-control-before-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/production-control-before.json
          retention-days: 7
          if-no-files-found: error

      - name: Capture preview Worker versions before deployment (read-only)
        run: npx --no-install wrangler versions list --env preview --json > "$RUNNER_TEMP/preview-worker-versions-before.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs

      - name: Reconfirm live preview authorization immediately before deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const labels = pullRequest.labels.map(label => label.name);
            const failures = [];

            if (pullRequest.state !== 'open') failures.push('the pull request is no longer open');
            if (pullRequest.draft) failures.push('the pull request is now a draft');
            if (pullRequest.base.ref !== 'main') failures.push('the pull request no longer targets main');
            if (pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              failures.push('the pull request no longer has a same-repository head');
            }
            if (!labels.includes('deploy-preview')) failures.push('the deploy-preview label is absent');
            if (pullRequest.head.sha !== context.payload.pull_request.head.sha) {
              failures.push('the pull request head changed after this workflow started');
            }

            if (failures.length > 0) {
              core.setFailed(`Preview authorization revoked: ${failures.join('; ')}.`);
            }

      - name: Deploy to Cloudflare Workers (preview)
        id: preview-worker-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$ESV_API_KEY" | npx --no-install wrangler secret put ESV_API_KEY --env preview --env-file /dev/null
          npx --no-install wrangler deploy --config "$RUNNER_TEMP/worker-release.json" --no-bundle --env-file /dev/null | tee "$RUNNER_TEMP/preview-worker-deploy.command-output.txt"

      - name: Verify exact active preview Worker version (read-only)
        id: preview-worker-pre-audit-identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler versions list --env preview --json > "$RUNNER_TEMP/preview-worker-versions-after.json"
          npx --no-install wrangler deployments list --env preview --json > "$RUNNER_TEMP/preview-worker-deployments-after.json"
          npx --no-install tsx scripts/verify-preview-worker-deployment.ts verify-deploy \
            --before-versions "$RUNNER_TEMP/preview-worker-versions-before.json" \
            --after-versions "$RUNNER_TEMP/preview-worker-versions-after.json" \
            --after-deployments "$RUNNER_TEMP/preview-worker-deployments-after.json" \
            --command-output "$RUNNER_TEMP/preview-worker-deploy.command-output.txt" \
            --output "$RUNNER_TEMP/preview-worker-deployment-pre-audit-identity.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify production control remained unchanged (read-only)
        id: production-control-after
        if: ${{ always() && steps.preview-worker-deploy.outcome == 'success' && steps.production-control-before.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler d1 list --json > "$RUNNER_TEMP/production-control-d1-inventory-after-deploy.json"
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-control-deployments-after.json"
          production_control_version="$(npx --no-install tsx scripts/production-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/production-control-deployments-after.json")"
          npx --no-install wrangler versions view "$production_control_version" --json \
            > "$RUNNER_TEMP/production-control-version-after.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts verify-control \
            --control "$RUNNER_TEMP/production-control-before.json" \
            --deployments "$RUNNER_TEMP/production-control-deployments-after.json" \
            --active-version-view "$RUNNER_TEMP/production-control-version-after.json" \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/production-control-d1-inventory-after-deploy.json" \
            --output "$RUNNER_TEMP/production-control-after.json"

      # Do this before either fixed black-box audit: a deployed Worker must be
      # both sole-active and bound to the readiness-tested candidate D1.
      - name: Require deployed candidate preview D1 binding (read-only)
        id: preview-worker-candidate-cutover
        if: ${{ steps.production-control-after.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          observed_active_version="$(npx --no-install tsx scripts/preview-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/preview-worker-deployments-after.json")"
          npx --no-install wrangler versions view "$observed_active_version" --env preview --json \
            > "$RUNNER_TEMP/preview-worker-candidate-version-view.json"
          npx --no-install tsx scripts/preview-release-reconciliation.ts observe-post-mutation \
            --predecessor-anchor "$RUNNER_TEMP/preview-worker-predecessor-anchor.json" \
            --deployments "$RUNNER_TEMP/preview-worker-deployments-after.json" \
            --observed-active-version-view "$RUNNER_TEMP/preview-worker-candidate-version-view.json" \
            --wrangler-config wrangler.toml \
            --output "$RUNNER_TEMP/preview-worker-candidate-cutover-observation.json"
          npx --no-install tsx scripts/preview-release-reconciliation.ts reconcile-post-mutation \
            --predecessor-anchor "$RUNNER_TEMP/preview-worker-predecessor-anchor.json" \
            --deployments "$RUNNER_TEMP/preview-worker-deployments-after.json" \
            --observed-active-version-view "$RUNNER_TEMP/preview-worker-candidate-version-view.json" \
            --wrangler-config wrangler.toml \
            --output "$RUNNER_TEMP/preview-worker-candidate-cutover.json"

      # The observation is create-only and deliberately retained even when
      # the following strict candidate-binding gate fails before any audit.
      - name: Upload preview candidate cutover observation
        if: ${{ always() && steps.preview-worker-deploy.outcome == 'success' && steps.preview-predecessor.outcome == 'success' && steps.preview-worker-candidate-cutover.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-candidate-cutover-observation-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/preview-worker-candidate-cutover-observation.json
          retention-days: 7
          if-no-files-found: error

      # This is deliberately a post-deploy release gate, not an ordinary PR
      # check: the runner is pinned to the canonical preview custom domain.
      # The deployment control plane can settle before every edge has the new
      # tool and resource registrations. This bounded, explicit probe is not an audit retry.
      - name: Stabilize preview release registrations at edge (read-only)
        id: preview-primary-source-edge-stabilization
        if: ${{ steps.preview-worker-candidate-cutover.outcome == 'success' }}
        continue-on-error: true
        run: |
          npx --no-install tsx scripts/audit-primary-source-edge-stabilization.ts \
            --output "$RUNNER_TEMP/preview-primary-source-edge-stabilization.json"

      - name: Upload preview edge-stabilization evidence
        if: ${{ always() && steps.preview-worker-candidate-cutover.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-edge-stabilization-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/preview-primary-source-edge-stabilization.json
          retention-days: 7
          if-no-files-found: error

      # Keep the failed probe observable above, then fail closed before either
      # fixed audit can start. The audits themselves retain zero retries.
      - name: Require stable preview release registrations before audits
        id: preview-primary-source-edge-stabilization-gate
        if: ${{ always() && steps.preview-worker-candidate-cutover.outcome == 'success' }}
        run: test "${{ steps.preview-primary-source-edge-stabilization.outcome }}" = success

      - name: Audit original-language v2 contract on preview
        id: preview-original-language-v2-audit
        if: ${{ steps.preview-primary-source-edge-stabilization-gate.outcome == 'success' }}
        run: |
          npx --no-install tsx scripts/audit-original-language-v2-preview.ts \
            --output "$RUNNER_TEMP/original-language-v2-preview-audit.json"
          test -s "$RUNNER_TEMP/original-language-v2-preview-audit.json"

      - name: Audit Transform-9 historical core contract on preview
        id: preview-historical-core-audit
        if: ${{ steps.preview-primary-source-edge-stabilization-gate.outcome == 'success' && steps.preview-original-language-v2-audit.outcome == 'success' }}
        run: |
          npx --no-install tsx scripts/audit-historical-core-preview.ts \
            --output "$RUNNER_TEMP/historical-core-preview-audit.json"
          test -s "$RUNNER_TEMP/historical-core-preview-audit.json"

      # Fixed Transform-11 coverage stays separate from the Transform-9 core
      # audit: each of the ten newly activated works must pass its own bounded
      # landing, browse, search, primary-source, read, and pagination probes.
      - name: Respect the shared IP request budget before the spine audit
        if: ${{ steps.preview-historical-core-audit.outcome == 'success' }}
        # SEC-03 makes all audit User-Agents share one IP allowance. Let the
        # earlier bounded suites leave the 60-second window; audits never retry.
        run: sleep 65

      - name: Audit Transform-11 historical spine contract on preview
        id: preview-historical-spine-audit
        if: ${{ steps.preview-primary-source-edge-stabilization-gate.outcome == 'success' && steps.preview-original-language-v2-audit.outcome == 'success' && steps.preview-historical-core-audit.outcome == 'success' }}
        run: |
          npx --no-install tsx scripts/audit-historical-spine-preview.ts \
            --output "$RUNNER_TEMP/historical-spine-preview-audit.json"
          test -s "$RUNNER_TEMP/historical-spine-preview-audit.json"

      - name: Prove legacy and modern MCP eras on the protected preview
        id: preview-dual-era-audit
        if: ${{ steps.preview-historical-spine-audit.outcome == 'success' }}
        run: |
          npx --no-install tsx scripts/audit-dual-era-mcp-preview.ts --output "$RUNNER_TEMP/dual-era-mcp-preview-audit.json"
          test -s "$RUNNER_TEMP/dual-era-mcp-preview-audit.json"

      # Runs after any post-deploy result (including audit failure or a later
      # authorization revocation) and is deliberately read-only. It does not
      # attempt an automatic rollback or destructive cleanup.
      - name: Capture preview post-mutation reconciliation record (read-only)
        id: preview-reconciliation
        if: ${{ always() && steps.preview-worker-deploy.outcome == 'success' && steps.preview-predecessor.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler deployments list --env preview --json > "$RUNNER_TEMP/preview-worker-deployments-post-mutation.json"
          observed_active_version="$(npx --no-install tsx scripts/preview-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/preview-worker-deployments-post-mutation.json")"
          npx --no-install wrangler versions view "$observed_active_version" --env preview --json > "$RUNNER_TEMP/preview-worker-observed-active-version-view.json"
          npx --no-install tsx scripts/preview-release-reconciliation.ts observe-post-mutation \
            --predecessor-anchor "$RUNNER_TEMP/preview-worker-predecessor-anchor.json" \
            --deployments "$RUNNER_TEMP/preview-worker-deployments-post-mutation.json" \
            --observed-active-version-view "$RUNNER_TEMP/preview-worker-observed-active-version-view.json" \
            --wrangler-config wrangler.toml \
            --output "$RUNNER_TEMP/preview-worker-post-mutation-reconciliation.json"

      - name: Hash sanitized preview reconciliation evidence
        id: preview-reconciliation-evidence
        if: ${{ always() && steps.preview-reconciliation.outcome == 'success' }}
        run: |
          candidate_cutover_observation_sha256="$(sha256sum "$RUNNER_TEMP/preview-worker-candidate-cutover-observation.json" | awk '{print $1}')"
          post_mutation_reconciliation_sha256="$(sha256sum "$RUNNER_TEMP/preview-worker-post-mutation-reconciliation.json" | awk '{print $1}')"
          printf 'candidate_cutover_observation_sha256=%s\n' "$candidate_cutover_observation_sha256" >> "$GITHUB_OUTPUT"
          printf 'post_mutation_reconciliation_sha256=%s\n' "$post_mutation_reconciliation_sha256" >> "$GITHUB_OUTPUT"

      - name: Verify preview Worker remained active through audit (read-only)
        id: preview-worker-audit-identity
        if: ${{ steps.preview-primary-source-edge-stabilization-gate.outcome == 'success' && steps.preview-original-language-v2-audit.outcome == 'success' && steps.preview-historical-core-audit.outcome == 'success' && steps.preview-historical-spine-audit.outcome == 'success' && steps.preview-dual-era-audit.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler deployments list --env preview --json > "$RUNNER_TEMP/preview-worker-deployments-post-audit.json"
          npx --no-install tsx scripts/verify-preview-worker-deployment.ts verify-audit-stability \
            --pre-audit-identity "$RUNNER_TEMP/preview-worker-deployment-pre-audit-identity.json" \
            --post-audit-deployments "$RUNNER_TEMP/preview-worker-deployments-post-audit.json" \
            --output "$RUNNER_TEMP/preview-worker-deployment-identity.json" \
            --github-output "$GITHUB_OUTPUT"

      # Re-prove the fixed production control after all preview probes and the
      # final preview Worker identity check. This remains read-only and catches
      # a production change that happened during the black-box audit window.
      - name: Verify production control remained unchanged after preview audits (read-only)
        id: production-control-post-audit
        if: ${{ steps.preview-primary-source-edge-stabilization-gate.outcome == 'success' && steps.preview-original-language-v2-audit.outcome == 'success' && steps.preview-historical-core-audit.outcome == 'success' && steps.preview-historical-spine-audit.outcome == 'success' && steps.preview-dual-era-audit.outcome == 'success' && steps.preview-worker-audit-identity.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          npx --no-install wrangler d1 list --json > "$RUNNER_TEMP/production-control-d1-inventory-post-audit.json"
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/production-control-deployments-post-audit.json"
          production_control_version="$(npx --no-install tsx scripts/production-release-reconciliation.ts active-version-id \
            --deployments "$RUNNER_TEMP/production-control-deployments-post-audit.json")"
          npx --no-install wrangler versions view "$production_control_version" --json \
            > "$RUNNER_TEMP/production-control-version-post-audit.json"
          npx --no-install tsx scripts/production-release-reconciliation.ts verify-control \
            --control "$RUNNER_TEMP/production-control-before.json" \
            --deployments "$RUNNER_TEMP/production-control-deployments-post-audit.json" \
            --active-version-view "$RUNNER_TEMP/production-control-version-post-audit.json" \
            --wrangler-config wrangler.toml \
            --d1-inventory "$RUNNER_TEMP/production-control-d1-inventory-post-audit.json" \
            --output "$RUNNER_TEMP/production-control-post-audit.json"

      - name: Create source-bound dual-era preview release receipt
        if: ${{ steps.production-control-post-audit.outcome == 'success' }}
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          source_tree="$(git rev-parse "$SOURCE_COMMIT^{tree}")"
          npx --no-install tsx scripts/dual-era-preview-release-receipt.ts create \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request "$PULL_REQUEST_NUMBER" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tree "$source_tree" \
            --audit "$RUNNER_TEMP/dual-era-mcp-preview-audit.json" \
            --worker-identity "$RUNNER_TEMP/preview-worker-deployment-identity.json" \
            --cutover "$RUNNER_TEMP/preview-worker-candidate-cutover.json" \
            --d1-readiness "$RUNNER_TEMP/preview-d1-readiness-receipt.json" \
            --d1-source-plan "$RUNNER_TEMP/corpus-source/plan.json" \
            --output "$RUNNER_TEMP/dual-era-preview-release-receipt.json"

      - name: Hash sanitized preview audit evidence
        id: preview-audit-evidence
        if: ${{ steps.production-control-post-audit.outcome == 'success' }}
        run: |
          edge_stabilization_sha256="$(sha256sum "$RUNNER_TEMP/preview-primary-source-edge-stabilization.json" | awk '{print $1}')"
          original_language_audit_sha256="$(sha256sum "$RUNNER_TEMP/original-language-v2-preview-audit.json" | awk '{print $1}')"
          historical_audit_sha256="$(sha256sum "$RUNNER_TEMP/historical-core-preview-audit.json" | awk '{print $1}')"
          historical_spine_audit_sha256="$(sha256sum "$RUNNER_TEMP/historical-spine-preview-audit.json" | awk '{print $1}')"
          identity_sha256="$(sha256sum "$RUNNER_TEMP/preview-worker-deployment-identity.json" | awk '{print $1}')"
          production_control_post_audit_sha256="$(sha256sum "$RUNNER_TEMP/production-control-post-audit.json" | awk '{print $1}')"
          printf 'edge_stabilization_sha256=%s\n' "$edge_stabilization_sha256" >> "$GITHUB_OUTPUT"
          printf 'original_language_audit_sha256=%s\n' "$original_language_audit_sha256" >> "$GITHUB_OUTPUT"
          printf 'historical_audit_sha256=%s\n' "$historical_audit_sha256" >> "$GITHUB_OUTPUT"
          printf 'historical_spine_audit_sha256=%s\n' "$historical_spine_audit_sha256" >> "$GITHUB_OUTPUT"
          printf 'identity_record_sha256=%s\n' "$identity_sha256" >> "$GITHUB_OUTPUT"
          printf 'production_control_post_audit_sha256=%s\n' "$production_control_post_audit_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload protected preview audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-release-audit-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/preview-primary-source-edge-stabilization.json
            ${{ runner.temp }}/original-language-v2-preview-audit.json
            ${{ runner.temp }}/historical-core-preview-audit.json
            ${{ runner.temp }}/historical-spine-preview-audit.json
            ${{ runner.temp }}/dual-era-mcp-preview-audit.json
            ${{ runner.temp }}/dual-era-preview-release-receipt.json
            ${{ runner.temp }}/preview-worker-deployment-identity.json
            ${{ runner.temp }}/preview-worker-candidate-cutover-observation.json
            ${{ runner.temp }}/preview-worker-candidate-cutover.json
            ${{ runner.temp }}/preview-d1-readiness-receipt.json
            ${{ runner.temp }}/production-control-before.json
            ${{ runner.temp }}/production-control-after.json
            ${{ runner.temp }}/production-control-post-audit.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload preview reconciliation evidence
        if: ${{ always() && steps.preview-reconciliation.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-release-reconciliation-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/preview-worker-candidate-cutover-observation.json
            ${{ runner.temp }}/preview-worker-candidate-cutover.json
            ${{ runner.temp }}/preview-worker-post-mutation-reconciliation.json
          retention-days: 7
          if-no-files-found: error

      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECKED_OUT_COMMIT: ${{ steps.preview-checkout.outputs.commit }}
          CHECKED_OUT_TREE: ${{ steps.preview-checkout.outputs.tree }}
          WORKER_VERSION_ID: ${{ steps.preview-worker-audit-identity.outputs.version_id }}
          WORKER_DEPLOYMENT_ID: ${{ steps.preview-worker-audit-identity.outputs.deployment_id }}
          WORKER_IDENTITY_SHA256: ${{ steps.preview-audit-evidence.outputs.identity_record_sha256 }}
          EDGE_STABILIZATION_SHA256: ${{ steps.preview-audit-evidence.outputs.edge_stabilization_sha256 }}
          ORIGINAL_LANGUAGE_AUDIT_SHA256: ${{ steps.preview-audit-evidence.outputs.original_language_audit_sha256 }}
          HISTORICAL_AUDIT_SHA256: ${{ steps.preview-audit-evidence.outputs.historical_audit_sha256 }}
          HISTORICAL_SPINE_AUDIT_SHA256: ${{ steps.preview-audit-evidence.outputs.historical_spine_audit_sha256 }}
          PRODUCTION_CONTROL_POST_AUDIT_SHA256: ${{ steps.preview-audit-evidence.outputs.production_control_post_audit_sha256 }}
          CANDIDATE_CUTOVER_OBSERVATION_SHA256: ${{ steps.preview-reconciliation-evidence.outputs.candidate_cutover_observation_sha256 }}
          POST_MUTATION_RECONCILIATION_SHA256: ${{ steps.preview-reconciliation-evidence.outputs.post_mutation_reconciliation_sha256 }}
          AUDIT_ARTIFACT: preview-release-audit-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const commit = process.env.CHECKED_OUT_COMMIT;
            const tree = process.env.CHECKED_OUT_TREE;
            const workerVersion = process.env.WORKER_VERSION_ID;
            const deployment = process.env.WORKER_DEPLOYMENT_ID;
            const workerIdentity = process.env.WORKER_IDENTITY_SHA256;
            const edgeStabilization = process.env.EDGE_STABILIZATION_SHA256;
            const originalLanguageAudit = process.env.ORIGINAL_LANGUAGE_AUDIT_SHA256;
            const historicalAudit = process.env.HISTORICAL_AUDIT_SHA256;
            const historicalSpineAudit = process.env.HISTORICAL_SPINE_AUDIT_SHA256;
            const productionControlPostAudit = process.env.PRODUCTION_CONTROL_POST_AUDIT_SHA256;
            const candidateCutoverObservation = process.env.CANDIDATE_CUTOVER_OBSERVATION_SHA256;
            const postMutationReconciliation = process.env.POST_MUTATION_RECONCILIATION_SHA256;
            const artifact = process.env.AUDIT_ARTIFACT;
            if (!/^[0-9a-f]{40}$/i.test(commit) || !/^[0-9a-f]{40}$/i.test(tree)
              || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(workerVersion)
              || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(deployment)
              || !/^[0-9a-f]{64}$/i.test(workerIdentity) || !/^[0-9a-f]{64}$/i.test(edgeStabilization)
              || !/^[0-9a-f]{64}$/i.test(originalLanguageAudit)
              || !/^[0-9a-f]{64}$/i.test(historicalAudit) || !/^[0-9a-f]{64}$/i.test(historicalSpineAudit)
              || !/^[0-9a-f]{64}$/i.test(productionControlPostAudit) || !/^[0-9a-f]{64}$/i.test(candidateCutoverObservation)
              || !/^[0-9a-f]{64}$/i.test(postMutationReconciliation)
              || !/^preview-release-audit-\d+-[0-9a-f]{40}$/i.test(artifact)) {
              core.setFailed('Preview release evidence is missing or malformed.');
              return;
            }
            const body = [
              '### Preview Deployed',
              '',
              '**Canonical URL:** https://preview-mcp.theologai.xyz',
              '**Canonical MCP Endpoint:** `https://preview-mcp.theologai.xyz/mcp`',
              '**Compatibility alias:** https://theologai-preview.tjfrederick.workers.dev',
              '**Compatibility MCP endpoint:** `https://theologai-preview.tjfrederick.workers.dev/mcp`',
              '',
              `Deployed from checked-out commit \`${commit}\` (tree \`${tree}\`).`,
              `Cloudflare confirms Worker version \`${workerVersion}\` at 100% in deployment \`${deployment}\`.`,
              `Edge-stabilization SHA-256: \`${edgeStabilization}\`; original-language audit SHA-256: \`${originalLanguageAudit}\`; historical-core audit SHA-256: \`${historicalAudit}\`; Transform-11 historical-spine audit SHA-256: \`${historicalSpineAudit}\`; identity record SHA-256: \`${workerIdentity}\`; post-audit production-control SHA-256: \`${productionControlPostAudit}\`; candidate-cutover observation SHA-256: \`${candidateCutoverObservation}\`; post-mutation reconciliation SHA-256: \`${postMutationReconciliation}\`; retained artifact: \`${artifact}\` (7 days).`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  operator-proof-source:
    name: Verify operator proof source (no cloud credentials)
    needs: build-worker
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 167 && github.event.pull_request.head.ref == 'codex/sec06-preview-credential-assessment' && contains(github.event.pull_request.labels.*.name, 'deploy-preview') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      source: ${{ steps.source.outputs.source }}
      tree: ${{ steps.source.outputs.tree }}
      base: ${{ steps.source.outputs.base }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify normal CI and live operator-proof authorization
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPERATOR_SOURCE_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            await require('./.github/scripts/verify-operator-proof-source.cjs')({github, context, core});

  operator-corpus-proof:
    name: Preview operator corpus verification
    needs: [operator-proof-source, validation-complete, build-worker]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 167 && contains(github.event.pull_request.labels.*.name, 'deploy-preview') && needs.operator-proof-source.result == 'success' && needs.validation-complete.result == 'success' }}
    concurrency:
      group: theologai-shared-preview-mutation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      envelope_sha256: ${{ steps.complete-proof.outputs.envelope_sha256 }}
    environment:
      name: preview
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.operator-proof-source.outputs.source }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify normal CI and live operator-proof authorization
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPERATOR_SOURCE_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            await require('./.github/scripts/verify-operator-proof-source.cjs')({github, context, core});
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.operator-proof-source.outputs.base }}
          path: release-control
          persist-credentials: false
      - name: Select release toolchain source
        id: release-toolchain-source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/actions/release-toolchain/action.yml
            .github/release-toolchain/package.json
            .github/release-toolchain/package-lock.json
          )
          base_files=0
          for file in "${files[@]}"; do
            if test -e "release-control/$file" || test -L "release-control/$file"; then
              test -f "release-control/$file"
              test ! -L "release-control/$file"
              base_files=$((base_files + 1))
            fi
          done
          case "$base_files" in
            3) printf 'source=base\n' >> "$GITHUB_OUTPUT" ;;
            0)
              # Bootstrap only an entirely absent trust set; missing individual
              # files in an established base never permit a candidate fallback.
              for file in "${files[@]}"; do
                test -f "$file"
                test ! -L "$file"
              done
              printf 'source=introduction\n' >> "$GITHUB_OUTPUT"
              echo '::notice::Using the separately locked release toolchain introduced by this approved PR.'
              ;;
            *) echo '::error::The protected base has an incomplete release toolchain.'; exit 1 ;;
          esac

      - if: steps.release-toolchain-source.outputs.source == 'base'
        uses: ./release-control/.github/actions/release-toolchain

      - if: steps.release-toolchain-source.outputs.source == 'introduction'
        uses: ./.github/actions/release-toolchain

      - name: Download exact complete corpus proof source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus-preview-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/corpus-source
          merge-multiple: false
          digest-mismatch: error
      - name: Accept complete operator proof through the preview gate
        id: complete-proof
        uses: ./.github/actions/operator-corpus-proof
        with:
          role: preview
          source-plan-sha256: ${{ needs.build-worker.outputs.corpus_plan_sha256 }}
          base-commit: ${{ needs.operator-proof-source.outputs.base }}
          output: ${{ runner.temp }}/preview-operator-readiness.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Retain proof verified by this protected preview job
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-operator-verified-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/operator-corpus-challenge.json
            ${{ runner.temp }}/operator-proof-envelope.json
            ${{ runner.temp }}/operator-proof/operator-proof-envelope.json
            ${{ runner.temp }}/operator-corpus-challenge.json.admission.jsonl
            ${{ runner.temp }}/preview-operator-readiness.json.events.jsonl
            ${{ runner.temp }}/preview-operator-readiness.json.budget.json
            ${{ runner.temp }}/preview-operator-readiness.json
            ${{ runner.temp }}/preview-operator-readiness.json.controls.jsonl
          retention-days: 7
          if-no-files-found: error

  operator-proof-upload:
    name: Retain operator corpus proof (no cloud credentials)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operator_proof_json != '' && github.actor_id == '40179660' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Retain bounded owner submission
        id: envelope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPERATOR_PROOF_JSON: ${{ inputs.operator_proof_json }}
        with:
          script: require('./.github/scripts/operator-proof-bridge.cjs').upload({context,core});
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.envelope.outputs.artifact_name }}
          path: ${{ runner.temp }}/operator-proof-envelope.json
          retention-days: 7
          if-no-files-found: error

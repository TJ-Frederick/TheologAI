name: Validate
description: Set up and run one named local validation suite after an exact, nonpersisted checkout.

inputs:
  suite:
    description: Validation suite to run.
    required: true

  selected:
    description: Explicit classifier selection; false records an intentional omission.
    default: 'true'
  classifier-result:
    description: Classifier conclusion; anything other than success fails closed.
    default: success
  selection-mode:
    description: Exact docs, serving or full classifier decision.
    default: full
  data-lineage-before:
    description: Canonical production plan first-parent baseline; empty for PR and scheduled validation.
    default: ''

runs:
  using: composite
  steps:
    - name: Validate requested suite
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        SELECTED: ${{ inputs.selected }}
        CLASSIFIER_RESULT: ${{ inputs.classifier-result }}
        MODE: ${{ inputs.selection-mode }}
      run: |
        test "$CLASSIFIER_RESULT" = success
        case "$SELECTED" in true|false) ;; *) exit 1 ;; esac
        case "$MODE" in docs|serving|full) ;; *) exit 1 ;; esac
        case "$SUITE" in
          core|data|worker|node|conformance|docs) ;;
          *)
            printf 'Unknown validation suite: %s\n' "$SUITE" >&2
            exit 1
            ;;
        esac
        case "$SUITE:$MODE:$SELECTED" in
          docs:docs:true|core:serving:true|core:full:true|data:full:true|data:docs:false|data:serving:false|worker:docs:false|node:docs:false|conformance:docs:false|worker:serving:true|node:serving:true|conformance:serving:true|worker:full:true|node:full:true|conformance:full:true) ;;
          *) echo 'Inconsistent validation selection' >&2; exit 1 ;;
        esac

    - name: Verify exact checkout and required history before installation
      id: context
      if: inputs.selected == 'true'
      shell: bash
      env:
        CI_SUITE: ${{ inputs.suite }}
        CI_EXPECTED_HEAD: ${{ github.sha }}
        CI_EVENT_NAME: ${{ github.event_name }}
        CI_REF: ${{ github.ref }}
        CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        CI_LINEAGE_BEFORE: ${{ inputs.data-lineage-before }}
      run: node .github/scripts/validation-context.cjs

    - if: inputs.selected == 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - if: inputs.selected == 'true'
      shell: bash
      run: npm ci --no-audit

    - name: Verify historical section-key lineage
      if: inputs.selected == 'true' && inputs.suite == 'data'
      shell: bash
      env:
        PREVIOUS_MAIN_SHA: ${{ steps.context.outputs.baseline }}
      run: |
        if git cat-file -e "$PREVIOUS_MAIN_SHA:data/historical-section-key-plan.json"; then
          git show "$PREVIOUS_MAIN_SHA:data/historical-section-key-plan.json" > "$RUNNER_TEMP/historical-section-key-plan.previous.json"
          npm run data:verify-section-keys -- --previous-plan "$RUNNER_TEMP/historical-section-key-plan.previous.json"
        else
          npm run data:verify-section-keys -- --genesis
        fi

    - name: Record intentional omission
      if: inputs.selected == 'false'
      shell: bash
      run: echo 'This change does not affect this validation suite; the required check remains explicit.'

    - name: Run core validation
      if: inputs.selected == 'true' && inputs.suite == 'core'
      shell: bash
      run: |
        npm run audit:dependencies:high
        npm audit --omit=dev
        npm run types:worker:check
        npm run types:ccel-coordinator:check
        npm run validate:worker-config
        npm run validate:ccel-coordinator-config
        npm run validate:ccel-coordinator-test-config
        npm run typecheck:node
        npm run typecheck:release-scripts
        npm run typecheck:test-node
        npm run typecheck:test-scripts
        npm run typecheck:test-frozen-context-capacity
        npm run typecheck:worker
        npm run typecheck:ccel-coordinator
        npm run typecheck:worker-runtime
        npm run typecheck:ccel-coordinator-test
        npm run test:coverage
        npm run test:integration
        npm run build

    - name: Run data validation
      if: inputs.selected == 'true' && inputs.suite == 'data'
      shell: bash
      run: |
        test ! -e data/theologai.db
        npm run data:verify-sources
        npm run audit:release-corpus-capacity -- --output-database "$RUNNER_TEMP/theologai.db"
        test -f "$THEOLOGAI_TEST_DATABASE_PATH"
        npm run test:d1-readiness-generated-db
        npm run d1:seed:export -- --database "$RUNNER_TEMP/theologai.db" --clean
        npm run d1:seed:verify
        cp scripts/d1-seed/seed-manifest.json "$RUNNER_TEMP/d1-seed-manifest.json"
        npm run d1:seed:export -- --database "$RUNNER_TEMP/theologai.db" --clean
        cmp "$RUNNER_TEMP/d1-seed-manifest.json" scripts/d1-seed/seed-manifest.json
        npm run d1:seed:verify
        npm run d1:seed:verify-import -- --database "$RUNNER_TEMP/theologai.db"
        npx --no-install tsx scripts/historical-section-compatibility-evidence.ts \
          --database "$RUNNER_TEMP/theologai.db" \
          --seed-directory scripts/d1-seed
        npm run d1:seed:verify-workerd
      env:
        THEOLOGAI_TEST_DATABASE_PATH: ${{ runner.temp }}/theologai.db

    - name: Run Worker validation
      if: inputs.selected == 'true' && inputs.suite == 'worker'
      shell: bash
      run: |
        npm run test:worker-runtime
        npm run test:ccel-coordinator-runtime
        npm run test:worker-bundle-ubs
        npm run test:worker-production-runtime

    - name: Run Node HTTP validation
      if: inputs.selected == 'true' && inputs.suite == 'node'
      shell: bash
      run: npm run test:e2e

    - name: Run MCP conformance validation
      if: inputs.selected == 'true' && inputs.suite == 'conformance'
      shell: bash
      run: npm run test:conformance

    - name: Run documentation validation
      if: inputs.selected == 'true' && inputs.suite == 'docs'
      shell: bash
      run: npm run docs:check

name: Accept complete operator corpus proof
description: Keep the approved operator credential local; validate owner-submitted proof inside the protected gate.
inputs:
  role:
    required: true
    description: Existing preview or production target
  source-plan-sha256:
    required: true
    description: Digest emitted by the unprivileged source artifact build
  base-commit:
    required: true
    description: Exact protected base used for this candidate
  output:
    required: true
    description: Canonical complete readiness receipt destination
outputs:
  envelope_sha256:
    description: Hash verified by the protected job for same-run downstream use
    value: ${{ steps.accept.outputs.envelope_sha256 }}
runs:
  using: composite
  steps:
    - name: Create source-bound operator challenge after protected approval
      shell: bash
      env:
        OPERATOR_BASE_COMMIT: ${{ inputs.base-commit }}
        PROOF_ROLE: ${{ inputs.role }}
        SOURCE_PLAN_SHA256: ${{ inputs.source-plan-sha256 }}
      run: npx --no-install tsx scripts/operator-corpus-proof.ts challenge "$PROOF_ROLE" "$RUNNER_TEMP/corpus-source" "$SOURCE_PLAN_SHA256" "$RUNNER_TEMP/operator-corpus-challenge.json"
    - name: Retain protected operator challenge
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: operator-corpus-challenge-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/operator-corpus-challenge.json
        retention-days: 7
        if-no-files-found: error
    - name: Wait for owner-submitted complete proof
      id: evidence
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: await require('./.github/scripts/operator-proof-bridge.cjs').wait({github,context,core});
    - name: Download exact owner-submitted proof artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ steps.evidence.outputs.artifact_name }}
        run-id: ${{ steps.evidence.outputs.run_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/operator-proof
        merge-multiple: false
        digest-mismatch: error
    - name: Validate full proof and unchanged controls without SQL
      id: accept
      shell: bash
      env:
        SOURCE_PLAN_SHA256: ${{ inputs.source-plan-sha256 }}
        PROOF_OUTPUT: ${{ inputs.output }}
      run: npx --no-install tsx scripts/operator-corpus-proof.ts accept "$RUNNER_TEMP/operator-corpus-challenge.json" "$RUNNER_TEMP/operator-proof/operator-proof-envelope.json" "$RUNNER_TEMP/corpus-source" "$SOURCE_PLAN_SHA256" "$PROOF_OUTPUT"

name: Release toolchain
description: Install the separately locked deployment trust set on a fresh runner without the root dependency graph.
runs:
  using: composite
  steps:
    - name: Read the trusted release runtime pin
      id: release-runtime
      shell: bash
      env:
        RELEASE_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        version="$(cat "$RELEASE_ACTION_PATH/../../../.nvmrc")"
        [[ "$version" =~ ^22\.[0-9]+\.[0-9]+$ ]]
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ steps.release-runtime.outputs.version }}
        package-manager-cache: false
    - name: Install only the release trust set
      shell: bash
      env:
        RELEASE_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        test ! -e node_modules
        test ! -L node_modules
        toolchain_dir="$RELEASE_ACTION_PATH/../../release-toolchain"
        npm ci --prefix "$toolchain_dir" --ignore-scripts --no-audit --fund=false
        npm audit --prefix "$toolchain_dir" --package-lock-only --audit-level=high
        # D1 authority planning replays SQLite locally. This is the only
        # explicitly permitted native install; all other lifecycle hooks stay off.
        npm rebuild --prefix "$toolchain_dir" better-sqlite3 --ignore-scripts=false
        ln -s "$toolchain_dir/node_modules" node_modules
        test ! -e node_modules/vitest
